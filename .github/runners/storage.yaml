# Dedicated runner scratch storage; independent of k3s's default provisioner.
# The mount and its marker must exist on karnataka before provisioning PVCs.
apiVersion: v1
kind: Namespace
metadata:
  name: tuna-ci-storage
  labels:
    # Only storage helpers here need hostPath; runner pods remain in tuna-ci.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuna-ci-scratch-provisioner
  namespace: tuna-ci-storage
---
# Helper pod lifecycle and configuration reads never need cross-namespace access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tuna-ci-scratch-provisioner
  namespace: tuna-ci-storage
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    # The upstream readiness probe lists ConfigMaps in its own namespace.
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tuna-ci-scratch-provisioner
  namespace: tuna-ci-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tuna-ci-scratch-provisioner
subjects:
  - kind: ServiceAccount
    name: tuna-ci-scratch-provisioner
    namespace: tuna-ci-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuna-ci-scratch-provisioner
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuna-ci-scratch-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuna-ci-scratch-provisioner
subjects:
  - kind: ServiceAccount
    name: tuna-ci-scratch-provisioner
    namespace: tuna-ci-storage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tuna-ci-scratch-config
  namespace: tuna-ci-storage
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": []
        },
        {
          "node": "karnataka",
          "paths": ["/var/lib/tuna-ci-scratch"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    parent=${VOL_DIR%/*}
    test "$parent" = /var/lib/tuna-ci-scratch
    # This marker exists only on the mounted scratch LV, never on the root disk.
    test -f "$parent/.nvme-scratch"
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    parent=${VOL_DIR%/*}
    test "$parent" = /var/lib/tuna-ci-scratch
    test -f "$parent/.nvme-scratch"
    rm -rf -- "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: tuna-ci-scratch-helper
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          image: rancher/mirrored-library-busybox:1.37.0
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuna-ci-scratch-provisioner
  namespace: tuna-ci-storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tuna-ci-scratch-provisioner
  template:
    metadata:
      labels:
        app: tuna-ci-scratch-provisioner
    spec:
      serviceAccountName: tuna-ci-scratch-provisioner
      nodeSelector:
        kubernetes.io/hostname: karnataka
      containers:
        - name: provisioner
          image: rancher/local-path-provisioner:v0.0.37
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - rancher.io/tuna-ci-scratch
            - --configmap-name
            - tuna-ci-scratch-config
            - --service-account-name
            - tuna-ci-scratch-provisioner
            - --helper-image
            - rancher/mirrored-library-busybox:1.37.0
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/config/
              readOnly: true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            - name: HEALTH_PORT
              value: "8080"
      volumes:
        - name: config
          configMap:
            name: tuna-ci-scratch-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: tuna-ci-scratch
  annotations:
    # local volumes support runner user namespaces; hostPath PVs do not.
    defaultVolumeType: local
provisioner: rancher.io/tuna-ci-scratch
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
