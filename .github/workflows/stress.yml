name: nested stress

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      churn_rounds:
        description: 'scripts/tuna-stress rounds (empty: 10; the nightly runs 300)'
        required: false
        type: string
        default: ''
      hotplug_rounds:
        description: 'scripts/tuna-hotplug-stress rounds (empty: 4; the nightly runs 30)'
        required: false
        type: string
        default: ''
      hotplug_heaptrack:
        description: 'after the hotplug gate, run the storm again under heaptrack and keep the allocation traces'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/tuna-stress'
      - 'scripts/tuna-hotplug-stress'
      - 'scripts/tuna-wayland-adversary-build'
      - 'scripts/lib/tuna-wayland-adversary.c'
      - 'scripts/lib/tuna-service-stubs.py'
      - 'scripts/lib/tuna_process_metrics.py'
      - '.github/workflows/stress.yml'

permissions:
  contents: read

concurrency:
  group: nested-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  churn:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Identify native cache platform
        id: cache-platform
        run: |
          . /etc/os-release
          echo "distro=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ steps.cache-platform.outputs.distro }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool scrot ffmpeg jq dbus libglib2.0-bin xwayland x11-apps pipewire wireplumber gstreamer1.0-pipewire gstreamer1.0-tools gstreamer1.0-plugins-good at-spi2-core python3-pyatspi fonts-cantarell shellcheck libglib2.0-dev libgtk-4-dev libfontconfig1-dev librsvg2-common libpipewire-0.3-dev libadwaita-1-dev meson ninja-build libwayland-dev wayland-protocols libpam-wrapper ibus gir1.2-ibus-1.0 wayland-utils
      - run: scripts/ci-install-gtk4-layer-shell
      - run: cargo build -p tuna-compositor -p tuna-wallpaper-svg -p tuna-shell-gtk -p tuna-shell-host
      - name: Churn, floods, protocol fuzz, service and shell faults, input and lock; gate input and growth
        env:
          ROUNDS: ${{ inputs.churn_rounds || (github.event_name == 'schedule' && '300' || '10') }}
        run: |
          case "$ROUNDS" in
            ''|0*|*[!0-9]*) echo "::error::rounds must be a positive integer, not '$ROUNDS'"; exit 1 ;;
          esac
          scripts/tuna-stress --rounds "$ROUNDS" --out stress-artifacts
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: nested-stress
          path: stress-artifacts/
          retention-days: 14

  hotplug:
    # Output hotplug and scale storm on real DRM (#203): a vkms configfs
    # instance (Linux 6.19+, so the 26.04 image's 7.0 kernel) whose B and
    # C connectors are plugged and unplugged under a hardware session with
    # the GTK shell and real GTK clients. See docs/testing.md.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Identify native cache platform
        id: cache-platform
        run: |
          . /etc/os-release
          echo "distro=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ steps.cache-platform.outputs.distro }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config libwayland-dev wayland-protocols seatd kmod dbus libglib2.0-bin libglib2.0-dev libgtk-4-dev libfontconfig1-dev librsvg2-common libpipewire-0.3-dev libadwaita-1-dev python3-gi gir1.2-gtk-4.0 python3-evdev fonts-cantarell meson ninja-build
      - run: scripts/ci-install-gtk4-layer-shell
      - run: python3 -m py_compile scripts/tuna-hotplug-stress scripts/lib/tuna_process_metrics.py
      - run: scripts/ci-install-vkms
      - run: cargo build -p tuna-compositor -p tuna-wallpaper-svg -p tuna-shell-gtk
      - name: Plug and unplug outputs under a hardware session; gate outputs, windows, clients, input and growth
        env:
          ROUNDS: ${{ inputs.hotplug_rounds || (github.event_name == 'schedule' && '30' || '4') }}
        run: |
          case "$ROUNDS" in
            ''|0*|*[!0-9]*) echo "::error::rounds must be a positive integer, not '$ROUNDS'"; exit 1 ;;
          esac
          scripts/tuna-hotplug-stress --rounds "$ROUNDS" --out hotplug-artifacts
      - name: Record the compositor's and the shell's allocation backtraces over the same storm (diagnostic)
        if: ${{ always() && inputs.hotplug_heaptrack }}
        continue-on-error: true
        env:
          ROUNDS: ${{ inputs.hotplug_rounds || '4' }}
        run: |
          case "$ROUNDS" in
            ''|0*|*[!0-9]*) echo "::error::rounds must be a positive integer, not '$ROUNDS'"; exit 1 ;;
          esac
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y heaptrack zstd
          scripts/tuna-hotplug-stress --rounds "$ROUNDS" --heaptrack --out hotplug-artifacts/heaptrack
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hotplug-stress
          path: hotplug-artifacts/
          retention-days: 14
