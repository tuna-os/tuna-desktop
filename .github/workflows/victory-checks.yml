name: victory-checks

# The v1 victory signal (M1 of the v1 plan): informational only. The
# signal carries red; the job stays green. Runs nightly, never on PRs
# (it would fail every PR until v1 is done, which is the point of the
# signal, not of CI).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  victory-signal:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/victory-signal.py
        env:
          VICTORY_ROOT: .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: victory-signal
          path: victory-signal.json
          retention-days: 90
