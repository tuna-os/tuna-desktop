name: visual-capture

# Reproducible per-feature visual capture (stills + transition clips) of
# Tuna Desktop from nested compositor fixtures. Capture-only: this
# workflow adds no gates to ci.yml and asserts no product behavior. Each
# feature stage runs in its own job with fail-fast disabled and uploads
# its own visual-<stage> artifact, so one failed stage never prevents
# collecting the rest (the audit's early-exit finding).
on:
  workflow_dispatch:
    inputs:
      stages:
        description: 'Comma-separated stages to capture (default: all)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'scripts/tuna-visual-capture*'
      - 'scripts/lib/tuna-visual-*'
      - 'docs/visual-capture-*'
      - '.github/workflows/visual-capture.yml'
  push:
    branches: [w3-visual-capture]
    paths:
      - 'scripts/tuna-visual-capture*'
      - 'scripts/lib/tuna-visual-*'
      - 'docs/visual-capture-*'
      - '.github/workflows/visual-capture.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Identify native cache platform
        id: cache-platform
        run: |
          . /etc/os-release
          echo "distro=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ steps.cache-platform.outputs.distro }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Use the Ubuntu archive for GTK dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config libglib2.0-dev libgtk-4-dev libfontconfig1-dev librsvg2-common libpipewire-0.3-dev libadwaita-1-dev meson ninja-build libwayland-dev wayland-protocols python3-pil
      - run: scripts/ci-install-gtk4-layer-shell
      - run: shellcheck -x scripts/tuna-visual-capture scripts/tuna-walkthrough && python3 -m py_compile scripts/lib/tuna-visual-label.py scripts/lib/tuna-visual-finalize.py
      - run: scripts/tuna-visual-capture --check-matrix
      - run: python3 scripts/lib/tuna-walkthrough-freshness-tests.py
      - run: python3 scripts/lib/tuna-visual-label-tests.py
      - run: python3 scripts/lib/tuna-visual-finalize-tests.py
      - run: python3 scripts/lib/tuna-visual-validators-tests.py
      - run: python3 scripts/lib/tuna-visual-provenance-tests.py
      - run: python3 scripts/lib/tuna-visual-walkthrough-map-tests.py
      - run: /usr/bin/python3 scripts/lib/tuna-scale-frame-tests.py
      - run: cargo build --manifest-path Cargo.toml -p tuna-compositor -p tuna-shell-gtk -p tuna-shell-host
      - run: |
          mkdir -p visual-bin
          cp target/debug/tuna-compositor target/debug/tuna-shell-gtk target/debug/tuna-ibus-bridge visual-bin/
          cp /usr/local/lib/*/libgtk4-layer-shell.so* visual-bin/ 2>/dev/null || cp /usr/local/lib/libgtk4-layer-shell.so* visual-bin/
          sha256sum visual-bin/* > visual-bin/sha256sums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-bin
          path: visual-bin/
          retention-days: 14

  capture:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        stage: [panel, calendar, quick-settings, windows, x11, scroll, switcher, overview, search-apps, notifications, input, system, settings-a11y, transitions]
    env:
      TUNA_VISUAL_BIN_DIR: ${{ github.workspace }}/visual-bin
      LD_LIBRARY_PATH: ${{ github.workspace }}/visual-bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: visual-bin
          path: visual-bin
      - name: Use the Ubuntu archive for GTK dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool scrot ffmpeg jq dbus libglib2.0-bin xwayland x11-apps x11-utils at-spi2-core python3-pyatspi python3-pil fonts-cantarell libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev libwayland-dev wayland-protocols libpam-wrapper ibus ibus-gtk3 ibus-gtk4 gir1.2-ibus-1.0
      - run: chmod +x visual-bin/tuna-compositor visual-bin/tuna-shell-gtk visual-bin/tuna-ibus-bridge && sha256sum -c visual-bin/sha256sums.txt
      - name: Install and verify CJK glyphs for the visual IME fixture
        if: ${{ matrix.stage == 'input' && (inputs.stages == '' || contains(format(',{0},', inputs.stages), ',input,')) }}
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends fontconfig fonts-noto-cjk
          /usr/bin/python3 scripts/lib/tuna-visual-cjk-font-tests.py
          /usr/bin/python3 scripts/lib/tuna-visual-cjk-font.py visual-input/cjk-font-receipt.json
      - name: Capture ${{ matrix.stage }}
        if: ${{ inputs.stages == '' || contains(format(',{0},', inputs.stages), format(',{0},', matrix.stage)) }}
        run: scripts/tuna-visual-capture --stage "${{ matrix.stage }}" --artifacts "visual-${{ matrix.stage }}"
      - if: always()
        run: |
          mkdir -p "visual-${{ matrix.stage }}"
          if [ ! -f "visual-${{ matrix.stage }}/stage.json" ]; then
            printf '{"stage":"%s","status":"skipped","reason":"filtered out or never started"}\n' "${{ matrix.stage }}" > "visual-${{ matrix.stage }}/stage.json"
          fi
      - if: always()
        run: scripts/ci-prepare-artifacts "visual-${{ matrix.stage }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: visual-${{ matrix.stage }}
          path: visual-${{ matrix.stage }}/
          retention-days: 90

  manifest:
    needs: capture
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: visual-*
          path: visual-all
          merge-multiple: false
      - run: mkdir -p visual-all && scripts/tuna-visual-capture --merge --artifacts visual-all
      - run: scripts/tuna-visual-capture --check-matrix
      # Visible staleness report for the checked-in walkthrough images.
      # Non-gating (|| true): freshness fails until a refresh lands, and
      # must stay a report, never a silent absence or a gate change.
      # Expectations are explicit: CURRENT requires the recorded built
      # tree to equal this checkout's tree.
      - run: scripts/tuna-walkthrough freshness --dest docs --expect-head "$(git rev-parse HEAD)" --expect-tree "$(git rev-parse 'HEAD^{tree}')" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: visual-manifest
          path: visual-all/manifest.json
          retention-days: 90

  old-elf-acquisition:
    if: github.event_name == 'workflow_dispatch'
    runs-on: tuna-ci-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-grid
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 8eebec1308374d78b819c7f2fec48c03f7fc6d55
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Install unchanged original build dependencies
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = Path(".github/workflows/ci.yml").read_text()
          block = source.split("\n  grid-cancel-comparison:", 1)[1].split("\n  gtk-shell:", 1)[0]
          commands = [line.strip().removeprefix("- run: ") for line in block.splitlines()
                      if line.strip().startswith("- run: sudo apt-get")]
          assert len(commands) == 1
          subprocess.run(commands[0], shell=True, check=True, timeout=600)
          subprocess.run(["sudo", "apt-get", "install", "-y", "--no-install-recommends", "just"], check=True, timeout=120)
          PY
      - run: scripts/ci-install-gtk4-layer-shell
      - name: Acquire exact old ELF without running any product or proof
        run: |
          /usr/bin/python3 - <<'PY'
          import importlib.machinery, importlib.util, json, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          work = Path(os.environ["RUNNER_TEMP"]) / "old-elf-acquisition"
          work.mkdir()
          loader = importlib.machinery.SourceFileLoader("comparison", str(root / "scripts/tuna-grid-cancel-comparison"))
          spec = importlib.util.spec_from_loader(loader.name, loader)
          comparison = importlib.util.module_from_spec(spec)
          loader.exec_module(comparison)
          old = "da1b7c40c7cc69f5800970e61cffa3d4e95c3f65"
          subprocess.run(["git", "fetch", "--no-tags", "origin", old], check=True, timeout=60)
          source = work / "old-source"
          subprocess.run(["git", "worktree", "add", "--detach", str(source), old], check=True, timeout=60)
          _, admission, binaries = comparison.build(source, "old", work, {"scope": "compile-only original core identity acquisition; no runtime or qualification"})
          binary = binaries / "tuna-shell-gtk"
          notes = subprocess.check_output(["readelf", "-n", str(binary)], text=True, timeout=30)
          (work / "elf-notes.txt").write_text(notes)
          receipt = {"scope": "compile-only; no runtime/check/proof rerun", "admission": admission,
                     "expected_sha256": "5c6cb70faefd22adda123b79328a46c576aae680555e14bcbe315458b6b752fe",
                     "expected_core_build_id": "de1d2aae0ef79655a241a55a2c9af1b0268693d7",
                     "sha256": comparison.contract.digest(binary)}
          receipt["hash_matches_original"] = receipt["sha256"] == receipt["expected_sha256"]
          receipt["build_id_matches_original_core"] = f'Build ID: {receipt["expected_core_build_id"]}' in notes
          (work / "elf-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          assert receipt["hash_matches_original"] and receipt["build_id_matches_original_core"], receipt
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: exact-old-shell-ELF-NOT-ACCEPTANCE
          path: |
            ${{ runner.temp }}/old-elf-acquisition/bin-old/tuna-shell-gtk
            ${{ runner.temp }}/old-elf-acquisition/elf-receipt.json
            ${{ runner.temp }}/old-elf-acquisition/elf-notes.txt
            ${{ runner.temp }}/old-elf-acquisition/admission-old.json
            ${{ runner.temp }}/old-elf-acquisition/cargo-old-*.json
          retention-days: 90
      - if: always()
        run: CARGO_TARGET_DIR="${CARGO_TARGET_DIR}/old" just clean
