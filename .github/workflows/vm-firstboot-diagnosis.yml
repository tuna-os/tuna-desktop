name: Pristine Tuna firstboot diagnosis

# Read-only observation of an explicitly pinned signed reference platform.
# The before-fix UI is retained in run 41260572254. Reuse only for a genuine
# new diagnostic input; do not replay unchanged failures on each producer PR.
# This is never a release/promotion or consumer gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pristine-firstboot-diagnosis-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  pristine-firstboot:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: tuna-os/corral
          ref: 667edf09b70eb88b2a6398ae834d4c841c13f629
          path: corral-source
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: corral-source/go.mod
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install native producer, QEMU and actual browser dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo qemu-system-x86 qemu-utils ovmf python3-venv tesseract-ocr
          sudo modprobe loop
          sudo chmod a+rw /dev/kvm
          python3 -m venv "$RUNNER_TEMP/pristine-browser"
          "$RUNNER_TEMP/pristine-browser/bin/pip" install playwright==1.61.0
          "$RUNNER_TEMP/pristine-browser/bin/python" -m playwright install --with-deps chromium
      - name: Observe exact signed platform with no keys, accounts or image fixture
        env:
          GOMAXPROCS: "2"
          GOFLAGS: -p=2
        run: |
          "$RUNNER_TEMP/pristine-browser/bin/python" scripts/lib/vm_firstboot_diagnosis.py \
            --output "$RUNNER_TEMP/pristine-firstboot-evidence" \
            --corral-source "$GITHUB_WORKSPACE/corral-source" \
            --helper "$GITHUB_WORKSPACE/scripts/lib/vm_release_disk.go"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pristine-firstboot-diagnosis
          path: ${{ runner.temp }}/pristine-firstboot-evidence/
          if-no-files-found: error
          retention-days: 14
