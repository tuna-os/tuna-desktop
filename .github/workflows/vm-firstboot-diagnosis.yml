name: Pristine Tuna firstboot diagnosis

# Read-only observation of the current signed shipping platform BEFORE the
# firstboot product fix. This is never a release/promotion or consumer gate.
on:
  pull_request:
    paths:
      - .github/workflows/vm-firstboot-diagnosis.yml
      - scripts/lib/vm_firstboot_diagnosis.py
      - scripts/lib/vm_release_disk.go
      - scripts/lib/vm_release.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pristine-firstboot-diagnosis-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  pristine-firstboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuna-os/corral
          ref: 667edf09b70eb88b2a6398ae834d4c841c13f629
          path: corral-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: corral-source/go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Install native producer, QEMU and actual browser dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo qemu-system-x86 qemu-utils ovmf python3-venv tesseract-ocr
          sudo modprobe loop
          sudo chmod a+rw /dev/kvm
          python3 -m venv "$RUNNER_TEMP/pristine-browser"
          "$RUNNER_TEMP/pristine-browser/bin/pip" install playwright==1.58.0
          "$RUNNER_TEMP/pristine-browser/bin/python" -m playwright install --with-deps chromium
      - name: Observe exact signed platform with no keys, accounts or image fixture
        env:
          GOMAXPROCS: "2"
          GOFLAGS: -p=2
        run: |
          "$RUNNER_TEMP/pristine-browser/bin/python" scripts/lib/vm_firstboot_diagnosis.py \
            --output "$RUNNER_TEMP/pristine-firstboot-evidence" \
            --corral-source "$GITHUB_WORKSPACE/corral-source" \
            --helper "$GITHUB_WORKSPACE/scripts/lib/vm_release_disk.go"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pristine-firstboot-diagnosis
          path: ${{ runner.temp }}/pristine-firstboot-evidence/
          if-no-files-found: error
          retention-days: 14
