name: Pristine desktop VM release

# Deliberate normal release operation, separate from TunaOS publication policy.
# The handoff is data, never shell input or permission to skip admission.
on:
  workflow_dispatch:
    inputs:
      handoff:
        description: Actual qualified release/package/image/Corral JSON handoff; no defaults or candidate identities
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/vm-release.yml
      - scripts/lib/vm_release.py
      - scripts/lib/vm_release_disk.go
      - scripts/lib/vm-release-tests.py

permissions: {}

concurrency:
  group: desktop-vm-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  producer-tests:
    if: github.repository == 'tuna-os/tuna-desktop' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install behavioral parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil
      - run: python3 scripts/lib/vm-release-tests.py

  build:
    needs: producer-tests
    if: github.repository == 'tuna-os/tuna-desktop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Install native image and disk tools
        run: |
          # Reuse marlin-tuna-nightly's disposable hosted-runner disk profile.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo qemu-system-x86 qemu-utils ovmf zstd gnupg python3-yaml python3-pil
          sudo modprobe loop
          sudo chmod a+rw /dev/kvm
      - name: Admit real source, package, image, receipts and signed Corral assets
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF: ${{ inputs.handoff }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"vm-handoff.json").write_text(os.environ["HANDOFF"])'
          python3 scripts/lib/vm_release.py admit --handoff "$RUNNER_TEMP/vm-handoff.json" --output "$RUNNER_TEMP/vm-release"
      - name: Build pristine shipping disk through verified Corral LocalBuilder
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lib/vm_release.py build --output "$RUNNER_TEMP/vm-release" --source "$RUNNER_TEMP/corral-release-source"
      - name: Boot only a disposable copy and retain pristine shipping hash
        run: python3 scripts/lib/vm_release.py boot --output "$RUNNER_TEMP/vm-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vm-pristine-candidate
          path: ${{ runner.temp }}/vm-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  sign:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vm-pristine-candidate
          path: ${{ runner.temp }}/vm-release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      # Sign the exact staged bytes once. These are not release assets yet.
      # The native jobs consume this same signed manifest offline; no unsigned
      # candidate path, alternate trust descriptor or post-gate rewrite exists.
      - name: Install signed artifact inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - name: Sign and admit staged manifest under exact main workflow identity
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob --bundle "$RUNNER_TEMP/vm-release/manifest.json.sigstore.json" "$RUNNER_TEMP/vm-release/manifest.json"
          python3 scripts/lib/try_tuna_desktop.py inspect --manifest "$RUNNER_TEMP/vm-release/manifest.json" --bundle "$RUNNER_TEMP/vm-release/manifest.json.sigstore.json" --artifact-dir "$RUNNER_TEMP/vm-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vm-signed-candidate
          path: ${{ runner.temp }}/vm-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native:
    needs: sign
    name: Native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-amd64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vm-signed-candidate
          path: ${{ runner.temp }}/vm-release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Install Linux native QEMU and browser dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf python3-venv tesseract-ocr
      - name: Enable native Linux amd64 KVM
        if: matrix.platform == 'linux-amd64'
        run: sudo chmod a+rw /dev/kvm
      - name: Install macOS native QEMU
        if: runner.os == 'macOS'
        run: brew install qemu tesseract
      - name: Install isolated real browser driver
        run: |
          python3 -m venv "$RUNNER_TEMP/vm-browser"
          "$RUNNER_TEMP/vm-browser/bin/pip" install playwright==1.58.0 requests==2.32.5 Pillow==12.1.0
          "$RUNNER_TEMP/vm-browser/bin/python" -m playwright install --with-deps chromium
      - name: Qualify signed bytes, pristine firstboot UI, browser, guest arch and cleanup
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          "$RUNNER_TEMP/vm-browser/bin/python" scripts/lib/try_tuna_desktop.py qualify --artifact-dir "$RUNNER_TEMP/vm-release" --evidence-dir "$RUNNER_TEMP/vm-native/$PLATFORM" --platform "$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: vm-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/vm-native/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [build, sign, native]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vm-signed-candidate
          path: ${{ runner.temp }}/vm-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: vm-native-*
          path: ${{ runner.temp }}/vm-evidence-download
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Install signed artifact inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - name: Collect separate native evidence directories
        run: |
          mkdir -p "$RUNNER_TEMP/vm-native"
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            mv "$RUNNER_TEMP/vm-evidence-download/vm-native-$platform" "$RUNNER_TEMP/vm-native/$platform"
          done
      - name: Attach only native-qualified exact signed bytes to existing real release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/lib/vm_release.py publish --output "$RUNNER_TEMP/vm-release" --evidence-dir "$RUNNER_TEMP/vm-native"
