name: Corral visual tooling
on:
  workflow_dispatch:
    inputs:
      node_tool_smoke:
        description: Build and retain benchmark tool closure without registry publication
        type: boolean
        default: false
      node_tool_registry_action:
        description: Candidate tooling only; disabled by default
        type: choice
        options: [disabled, publish, verify-only]
        default: disabled
      node_tool_build_run:
        description: Original successful manual tool build run ID
        type: string
        default: ''
      node_tool_closure_artifact:
        description: Original small build closure artifact ID
        type: string
        default: ''
      node_tool_originals_artifact:
        description: Original OCI artifact ID
        type: string
        default: ''
      node_tool_built_source:
        description: Exact original built source SHA (not publisher source)
        type: string
        default: ''
  pull_request:
    paths:
      - scripts/tuna-corral-visual-capture
      - scripts/tuna-corral-guest-cpu
      - scripts/tuna-vm-perf
      - scripts/tuna-corral-perf-pairs
      - scripts/tuna-corral-benchmark-import
      - scripts/lib/corral_*.py
      - scripts/tests/test_corral_*.py
      - .github/workflows/corral-visual-tools.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m unittest discover -s scripts/tests -p 'test_corral_*.py' -v
      - run: python3 scripts/tuna-corral-visual-capture --help
      - run: python3 scripts/tuna-corral-guest-cpu --help
      - run: python3 scripts/tuna-corral-perf-pairs --help && python3 scripts/tuna-corral-benchmark-import --help && python3 scripts/tuna-vm-perf --help
      - run: python3 scripts/lib/tuna-perf-tests.py
      - run: python3 scripts/lib/tuna-perf-repeatability-tests.py
      - run: python3 scripts/lib/tuna-perf-vm-lifetime-tests.py
  node-tools-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.node_tool_smoke && github.repository == 'tuna-os/tuna-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate source and install CI tools
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_corral_node*.py' -v
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build exact tool image and exercise unprivileged runtime
        run: |
          mkdir -p "$RUNNER_TEMP/node-tools"
          podman build --platform linux/amd64 -f packaging/benchmark/Containerfile.node-tools -t node-tools:qualified .
          podman run --rm --user 107:107 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,size=256m,mode=1777 --memory 512m --cpus 1 node-tools:qualified /opt/tuna-tools/smoke.py > "$RUNNER_TEMP/node-tools/smoke.json"
          podman run --rm --user 107:107 --cap-drop ALL --security-opt no-new-privileges --read-only node-tools:qualified -c 'from pathlib import Path; print(Path("/opt/tuna-tools/private-inventory/installed-private-packages.txt").read_text()); print(Path("/opt/tuna-tools/private-inventory/RPM-SHA256SUMS").read_text())' > "$RUNNER_TEMP/node-tools/rpm-inventory.txt"
          podman save --format oci-archive -o "$RUNNER_TEMP/node-tools/original-tools.oci.tar" node-tools:qualified
      - name: Retain exact closure
        run: |
          python3 scripts/lib/corral-node-tool-closure.py "$RUNNER_TEMP/node-tools/original-tools.oci.tar" "$RUNNER_TEMP/node-tools/smoke.json" "$RUNNER_TEMP/node-tools/closure" --source "$GITHUB_SHA"
          sha256sum scripts/lib/corral_node_{stage,worker}.py packaging/benchmark/Containerfile.node-tools scripts/lib/corral-node-tool-{smoke,closure}.py > "$RUNNER_TEMP/node-tools/source-sha256.txt"
      - name: Upload small original closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corral-node-tool-closure
          path: ${{ runner.temp }}/node-tools/closure/tool-closure.json
          if-no-files-found: error
      - name: Retain original tool bytes and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corral-node-tool-originals
          path: |
            ${{ runner.temp }}/node-tools/original-tools.oci.tar
            ${{ runner.temp }}/node-tools/smoke.json
            ${{ runner.temp }}/node-tools/rpm-inventory.txt
            ${{ runner.temp }}/node-tools/source-sha256.txt
          if-no-files-found: warn
  node-tools-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.node_tool_registry_action == 'publish' && github.repository == 'tuna-os/tuna-desktop'
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify original custody and publish candidate tooling
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_TOOL_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.node_tool_build_run }}
          CLOSURE_ARTIFACT: ${{ inputs.node_tool_closure_artifact }}
          ORIGINALS_ARTIFACT: ${{ inputs.node_tool_originals_artifact }}
          BUILT_SOURCE: ${{ inputs.node_tool_built_source }}
        run: |
          python3 scripts/tuna-corral-node-tools-publish --build-run "$BUILD_RUN" --closure-artifact "$CLOSURE_ARTIFACT" --originals-artifact "$ORIGINALS_ARTIFACT" --built-source "$BUILT_SOURCE" --publisher-source "$GITHUB_SHA" --publisher-run "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/node-tools-publication"
      - name: Retain original small publication and failure receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corral-node-tool-publication
          path: ${{ runner.temp }}/node-tools-publication/
          if-no-files-found: error
  node-tools-anonymous-verify:
    if: github.event_name == 'workflow_dispatch' && inputs.node_tool_registry_action == 'verify-only' && github.repository == 'tuna-os/tuna-desktop'
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify original custody and anonymously verify candidate tooling
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.node_tool_build_run }}
          CLOSURE_ARTIFACT: ${{ inputs.node_tool_closure_artifact }}
          ORIGINALS_ARTIFACT: ${{ inputs.node_tool_originals_artifact }}
          BUILT_SOURCE: ${{ inputs.node_tool_built_source }}
        run: |
          python3 scripts/tuna-corral-node-tools-publish --build-run "$BUILD_RUN" --closure-artifact "$CLOSURE_ARTIFACT" --originals-artifact "$ORIGINALS_ARTIFACT" --built-source "$BUILT_SOURCE" --publisher-source "$GITHUB_SHA" --publisher-run "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/node-tools-publication" --verify-only
      - name: Retain original small publication and failure receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corral-node-tool-publication
          path: ${{ runner.temp }}/node-tools-publication/
          if-no-files-found: error
