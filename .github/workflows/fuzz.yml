name: control decoder fuzz

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  pull_request:
    # Draft pull requests skip the fuzz job; marking one ready starts it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'fuzz/**'
      - 'crates/shell-control-schema/**'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

concurrency:
  group: control-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decoder:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [control_frame, control_body]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-11-12
      - name: Identify native cache platform
        id: cache-platform
        run: |
          . /etc/os-release
          echo "distro=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: fuzz -> target
          shared-key: control-fuzz-${{ steps.cache-platform.outputs.distro }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz with address sanitizer and fixed limits
        env:
          TARGET: ${{ matrix.target }}
          BUDGET: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cp "fuzz/seeds/$TARGET/"* "fuzz/corpus/$TARGET/"
          set -o pipefail
          cargo fuzz run "$TARGET" -- -max_total_time="$BUDGET" -max_len=1048580 -timeout=5 -rss_limit_mb=2048 2>&1 | tee "fuzz/$TARGET.log"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/*.log
            fuzz/artifacts/
            fuzz/corpus/
          retention-days: 14
