name: gnome51-baseline

# Captures the GNOME 51 reference journeys from the TunaOS Marlin GNOME
# live ISO (#64): one still + clip per stage plus a manifest pinning the
# ISO sha256. Parity rows and visual reviews compare against this bundle.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - scripts/tuna-baseline
      - .github/workflows/baseline.yml

permissions:
  contents: read

concurrency:
  group: gnome51-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Free disk for the 5.7 GB ISO
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf ffmpeg
      - run: scripts/tuna-baseline --out baseline-artifacts
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: gnome51-baseline
          path: baseline-artifacts/
          retention-days: 90
  # Capture runs with read-only repository access. Only publishing the
  # retained bundle on main needs permission to create/update release assets.
  publish:
    needs: capture
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: gnome51-baseline
          path: baseline-artifacts/
      - name: Publish retained reference bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view baseline-gnome51 >/dev/null 2>&1 || \
            gh release create baseline-gnome51 --prerelease --title "GNOME 51 baseline bundle" \
              --notes "Reference journeys captured from the TunaOS Marlin GNOME live ISO. See manifest.json for the exact ISO sha256."
          gh release upload baseline-gnome51 --clobber baseline-artifacts/*.png baseline-artifacts/*.mp4 baseline-artifacts/manifest.json
