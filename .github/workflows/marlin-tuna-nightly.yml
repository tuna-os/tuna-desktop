name: marlin-tuna-nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      digest:
        description: 'sha256 digest of ghcr.io/tuna-os/marlin to qualify (empty: newest marlin:tuna)'
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/marlin-tuna-nightly.yml
      - packaging/marlin/vm-lane/Containerfile.published
      - packaging/marlin/vm-lane/tuna-vm-lifecycle
      - packaging/marlin/vm-lane/tuna-vm-health
      - packaging/marlin/vm-lane/tuna-vm-constraints.c
      - packaging/marlin/vm-lane/tuna-vm-constraints-build
      - packaging/marlin/vm-lane/tuna-vm-gdm.tmpfiles
      - scripts/tuna-vm-lane
      - scripts/tuna-vm-soak
      - scripts/tuna-frame-pacer-build
      - scripts/lib/tuna-frame-pacer.c
      - scripts/lib/endurance_presentation.py
      - scripts/lib/soak_report.py

permissions:
  contents: read

concurrency:
  group: marlin-tuna-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  published-flavor:
    runs-on: ubuntu-26.04
    # The qualification boots take about 20 minutes; the bounded soak below
    # adds its 50 minutes plus one boot and the file transfer.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare the existing KVM profile
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo mkdir -p /mnt/vm && sudo chown "$(id -u):$(id -g)" /mnt/vm
          sudo apt-get -o Acquire::Retries=3 update -qq
          # python3-pil + fonts-dejavu-core: the lane renders its tour cards from source (as marlin-vm does).
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf ffmpeg podman skopeo python3-pil fonts-dejavu-core
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          # Keep the existing lane's 0666 policy after asynchronous udev setup.
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Resolve the image under test to one digest and add fixtures without replacing payload
        env:
          REQUESTED_DIGEST: ${{ inputs.digest }}
        run: |
          # A dispatch qualifies exactly the requested digest; the nightly
          # resolves the newest marlin:tuna once and pins every later step
          # to that digest, so a tag move mid-run cannot change the subject.
          if [ -n "$REQUESTED_DIGEST" ]; then
            digest="sha256:${REQUESTED_DIGEST#sha256:}"
          else
            digest=$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/tuna-os/marlin:tuna)
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "not a sha256 digest: $digest" >&2; exit 1; }
          sudo podman pull "ghcr.io/tuna-os/marlin@$digest"
          test "$(sudo podman image inspect "ghcr.io/tuna-os/marlin@$digest" --format '{{.Digest}}')" = "$digest"
          echo "$digest" | tee /mnt/vm/published-digest
          sudo podman build -f packaging/marlin/vm-lane/Containerfile.published \
            --build-arg "BASE_IMAGE=ghcr.io/tuna-os/marlin@$digest" \
            -t localhost/marlin-tuna-published-fixtures:ci .
          sudo podman run --rm --entrypoint cat localhost/marlin-tuna-published-fixtures:ci \
            /usr/share/tuna-vm/shipped-package.txt | tee /mnt/vm/shipped-package
          sudo podman image inspect localhost/marlin-tuna-published-fixtures:ci --format '{{.Id}}' | tee /mnt/vm/fixture-image-id
      - name: Install published flavor fixture to the existing raw-disk profile
        id: disk
        run: |
          probe='
            if ls /usr/lib/bootupd/updates/EFI/*/grub*.efi >/dev/null 2>&1; then :
            elif grep -A8 "^\[composefs\]" /usr/lib/ostree/prepare-root.conf 2>/dev/null | grep -qiE "enabled[[:space:]]*=[[:space:]]*(yes|true|1|signed)" \
              || find /usr/lib/systemd/boot/efi -name "systemd-boot*.efi" 2>/dev/null | grep -q .; then echo --composefs-backend; fi
            grep -A8 "^\[composefs\]" /usr/lib/ostree/prepare-root.conf 2>/dev/null | grep -qiE "enabled[[:space:]]*=[[:space:]]*(yes|true|1|signed)" && echo "--filesystem ext4" || true'
          read -ra install_args <<< "$(sudo podman run --rm --entrypoint "" localhost/marlin-tuna-published-fixtures:ci sh -c "$probe" | tr '\n' ' ')"
          truncate -s 20G /mnt/vm/disk.raw
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v /mnt/vm:/output \
            localhost/marlin-tuna-published-fixtures:ci \
            bootc install to-disk --via-loopback --generic-image --wipe "${install_args[@]}" /output/disk.raw
          sudo chown "$(id -u):$(id -g)" /mnt/vm/disk.raw
          sudo podman rmi -a -f >/dev/null 2>&1 || true
      - name: Real shipped GDM PAM login, semantic tour and lifecycle
        run: >-
          scripts/tuna-vm-lane --disk /mnt/vm/disk.raw --out published-vm-artifacts
          --boots 5 --published --require-kvm --tour
          --meta "published_image=ghcr.io/tuna-os/marlin@$(cat /mnt/vm/published-digest)"
          --meta "fixture_image_id=$(cat /mnt/vm/fixture-image-id)"
          --meta "shipped_tuna_package=$(cat /mnt/vm/shipped-package)"
          --meta "run_id=${{ github.run_id }}"
          --meta "harness_commit=${{ github.sha }}"
      - name: Bounded soak on a fresh pristine boot (memory and frame pacing; not the 24-hour qualification)
        id: soak
        if: ${{ !cancelled() && steps.disk.outcome == 'success' }}
        env:
          # Nightly and dispatch: 50 minutes, 40 of them after the observer's
          # ten-minute warmup. A pull request touching this lane rehearses the
          # same wiring for 15 minutes. Neither is the 24-hour qualification
          # run (docs/soak.md).
          SOAK_SECONDS: ${{ github.event_name == 'pull_request' && '900' || '3000' }}
          SOAK_WARMUP: ${{ github.event_name == 'pull_request' && '300' || '600' }}
        run: |
          # The deployment record: packaging/arch/PKGBUILD release builds fetch
          # tag v${_semver}, and pkgver drops the semver's first '-'
          # (1.0.0-beta.2 -> 1.0.0beta.2).
          package=$(cat /mnt/vm/shipped-package)
          version=${package#tuna-desktop }
          version=${version%-*}
          [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)([a-z].*)?$ ]] || { echo "unrecognised package: $package" >&2; exit 1; }
          tag="v${BASH_REMATCH[1]}${BASH_REMATCH[2]:+-${BASH_REMATCH[2]}}"
          refs=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          revision=$(awk -v ref="refs/tags/$tag^{}" '$2 == ref { print $1 }' <<< "$refs")
          [ -n "$revision" ] || revision=$(awk -v ref="refs/tags/$tag" '$2 == ref { print $1 }' <<< "$refs")
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "no release tag $tag for $package" >&2; exit 1; }
          scripts/tuna-vm-lane --disk /mnt/vm/disk.raw --out published-vm-soak --published --require-kvm \
            --soak "$SOAK_SECONDS" --soak-warmup "$SOAK_WARMUP" --soak-revision "$revision" \
            --meta "published_image=ghcr.io/tuna-os/marlin@$(cat /mnt/vm/published-digest)" \
            --meta "fixture_image_id=$(cat /mnt/vm/fixture-image-id)" \
            --meta "shipped_tuna_package=$package" \
            --meta "soak_source_tag=$tag" \
            --meta "run_id=${{ github.run_id }}" \
            --meta "harness_commit=${{ github.sha }}"
      - name: Publish per-check results for the digest under test
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path('published-vm-artifacts')
          out.mkdir(exist_ok=True)
          digest_path = pathlib.Path('/mnt/vm/published-digest')
          digest = digest_path.read_text().strip() if digest_path.exists() else None
          # assertions.txt is the gate across all pristine boots; the final
          # boot's manifest carries what each check actually observed.
          checks = {}
          final = out / 'manifest.json'
          observed = json.loads(final.read_text())['assertions'] if final.exists() else {}
          assertions = out / 'assertions.txt'
          if assertions.exists():
              for line in assertions.read_text().splitlines():
                  name, verdict, coverage = (line.split(' ', 2) + ['', ''])[:3]
                  detail = observed.get(name, {}).get('detail', '')
                  checks[name] = {'pass': verdict == 'pass',
                                  'detail': f'{detail} ({coverage})' if detail else coverage}
          excerpt = []
          for path in out.rglob('serial.log'):
              for line in path.read_text(errors='replace').splitlines():
                  if any(marker in line for marker in ('tuna-vm-health:', 'tuna-compositor: drm:',
                                                        'shell supervision: BudgetExhausted')):
                      excerpt.append(line)
          # The bounded soak boot is reported beside the qualification checks
          # (docs/soak.md); it is not 24-hour evidence.
          soak = None
          soak_dir = pathlib.Path('published-vm-soak')
          if (soak_dir / 'assertions.txt').exists():
              soak = {'artifact': f"published-marlin-tuna-soak-{os.environ['RUN_ID']}", 'checks': {}}
              for line in (soak_dir / 'assertions.txt').read_text().splitlines():
                  name, verdict, detail = (line.split(' ', 2) + ['', ''])[:3]
                  soak['checks'][name] = {'pass': verdict == 'pass', 'detail': detail}
              if (soak_dir / 'soak/summary.json').exists():
                  summary_json = json.loads((soak_dir / 'soak/summary.json').read_text())
                  soak['summary'] = {key: value for key, value in summary_json.items() if key != 'over_time'}
          results = {
              'run_id': os.environ['RUN_ID'], 'run_url': os.environ['RUN_URL'],
              'published_image': f'ghcr.io/tuna-os/marlin@{digest}' if digest else None,
              'published_image_digest': digest,
              'checks': checks,
              'soak': soak,
          }
          (out / 'qualification.json').write_text(json.dumps(results, indent=2))
          if not checks or not all(c['pass'] for c in checks.values()):
              (out / 'failure.json').write_text(json.dumps({**results, 'journal_excerpt': excerpt[-80:]}, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Published Marlin Tuna qualification\n\nImage: `ghcr.io/tuna-os/marlin@{digest}`\n\n")
              summary.write('| Check | Result | Detail |\n|---|---|---|\n')
              for name, check in checks.items():
                  detail = check['detail'].replace('|', '\\|')
                  summary.write(f"| {name} | {'pass' if check['pass'] else '**FAIL**'} | {detail} |\n")
              if soak:
                  summary.write('\n## Bounded VM soak\n\n| Soak boot check | Result | Detail |\n|---|---|---|\n')
                  for name, check in soak['checks'].items():
                      detail = check['detail'].replace('|', '\\|')
                      summary.write(f"| {name} | {'pass' if check['pass'] else '**FAIL**'} | {detail} |\n")
                  if (soak_dir / 'soak/summary.md').exists():
                      summary.write('\n' + (soak_dir / 'soak/summary.md').read_text())
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: published-marlin-tuna-vm-${{ github.run_id }}
          path: published-vm-artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.soak.outcome != 'skipped' }}
        with:
          name: published-marlin-tuna-soak-${{ github.run_id }}
          path: published-vm-soak/
          if-no-files-found: error
          retention-days: 30
