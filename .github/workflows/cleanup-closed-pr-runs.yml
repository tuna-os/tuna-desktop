name: Cleanup closed PR queues

on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Cancel eligible queued runs (otherwise dry run)
        type: boolean
        default: false

# One cleanup owner. Do not interrupt a pass partway through its API reads.
concurrency:
  group: cleanup-closed-pr-runs
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup:
    # No pull_request(_target) trigger or untrusted checkout with this token.
    # Manual dispatches must use the default branch too.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Retire only queued runs of closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python3 scripts/ci-cleanup-closed-pr-runs "${args[@]}"
