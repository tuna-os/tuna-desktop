name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full run, so drift in archlinux:latest, the Marlin base image
  # and runner images surfaces even on days nothing merges.
  schedule:
    - cron: "7 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but let every main run finish: main merges land
  # minutes apart, and cancelling meant no main run ever completed, which
  # also starved performance-baseline.yml (it needs a successful main run).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default: jobs that need more declare their own
# permissions block (which they already do where required).
permissions:
  contents: read

jobs:
  select-lanes:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The exact head is checked out; lane selection diffs it against
          # the pull request's base below.
          fetch-depth: 0
      # Which proof lanes this run executes (scripts/ci-select-lanes):
      # every lane on main, nightly and dispatch; on a pull request only
      # what the change can affect, with a rotating slice of the
      # end-to-end lanes for code changes (repo variable
      # CI_ROUND_ROBIN_SIZE, default 2).
      - name: Select proof lanes
        id: lanes
        env:
          CI_ROUND_ROBIN_SIZE: ${{ vars.CI_ROUND_ROBIN_SIZE }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --quiet origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA...HEAD" | scripts/ci-select-lanes --changed - >> "$GITHUB_OUTPUT"
          else
            scripts/ci-select-lanes >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Dependency caches stay job-specific and native-distro-specific.
      # Only trusted main populates them; PRs restore without duplicating them.
      - name: Identify native cache platform
        id: cache-platform
        run: |
          . /etc/os-release
          echo "distro=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ steps.cache-platform.outputs.distro }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          workspaces: |
            . -> target
            third-party/reis -> target
            third-party/smithay -> target
      # smithay links system libxkbcommon via the xkbcommon crate;
      # the greeter UI needs GTK4/libadwaita dev files.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev pkg-config libgtk-4-dev libfontconfig1-dev librsvg2-common libpipewire-0.3-dev libadwaita-1-dev libpam-wrapper libpam0g-dev zstd libglib2.0-dev libglib2.0-bin libglib2.0-dev-bin python3-yaml gsettings-desktop-schemas libegl1 libgl1-mesa-dri
      # The GTK shell (ADR 0006) links gtk4-layer-shell, which Ubuntu
      # 24.04 does not package.
      - run: sudo apt-get install -y meson ninja-build libwayland-dev wayland-protocols && scripts/ci-install-gtk4-layer-shell
      - run: scripts/tuna-a11y-baseline check
      # The rename to Tuna Desktop (#505): the script's self-test, and
      # a guard that no branch brings the old name back.
      - run: python3 scripts/lib/rename-to-tuna-tests.py
      - run: scripts/rename-to-tuna --check --no-cargo
      - run: python3 scripts/lib/tuna-soak-tests.py
      - run: python3 scripts/lib/vm-boot-tests.py
      - run: python3 scripts/tests/test_vm_guest_agent_deadline.py
      - run: python3 scripts/tests/test_vm_strip_acceptance.py
      - run: python3 scripts/tests/test_vm_strip_fixture_owner.py
      - run: python3 scripts/tests/test_vm_strip_image.py
      - run: python3 scripts/tests/test_vm_strip_stationary_edge.py
      - run: python3 scripts/lib/keyring-owner-proof-tests.py
      - run: python3 scripts/lib/tray-absence-proof-tests.py
      - run: python3 scripts/lib/ledger-tests.py
      - run: python3 scripts/lib/ci-select-lanes-tests.py
      - run: python3 scripts/lib/marlin-kernel-tests.py
      - run: python3 scripts/lib/gnome-drained-tests.py
      - run: python3 scripts/lib/mutter-profiler-integrity-tests.py
      - run: python3 scripts/lib/tuna-perf-payload-tests.py
      - run: python3 scripts/lib/tuna-perf-reference-tests.py
      - run: python3 scripts/lib/tuna-overview-receipt-tests.py
      - run: python3 scripts/ibus-property-proof-tests.py
      - run: python3 scripts/lib/grid-target-settled-tests.py
      - run: python3 scripts/lib/grid-anim-samples-tests.py
      - run: python3 scripts/lib/tuna-a11y-dump-tests.py
      - run: /usr/bin/python3 scripts/tests/test_grid_cancel_proof.py
      - run: /usr/bin/python3 scripts/tests/test_grid_cancel_comparison.py
      - run: python3 scripts/lib/pam-helper-source-tests.py
      - run: python3 scripts/lib/minimize-body-pixel-tests.py
      - run: python3 scripts/lib/media-causal-trace-tests.py
      - run: /usr/bin/python3 scripts/lib/media-completion-barrier-tests.py
      - run: /usr/bin/python3 scripts/lib/media-completion-proof-tests.py
      - run: /usr/bin/python3 scripts/lib/media-completion-fixture-tests.py
      - run: python3 scripts/tests/test_auth_owner_admission.py
      - run: |
          python3 scripts/tests/test_auth_no_replay_contract.py
          python3 scripts/tests/test_auth_proof_identity.py
          python3 scripts/tests/test_auth_proof_process.py
      - run: python3 scripts/tests/test_minimize_ci_freeze.py
      - run: python3 scripts/tests/test_minimize_brightness_controls.py
      - run: python3 scripts/tests/test_wb_shell_contract.py
      - run: python3 scripts/lib/window-lifecycle-proof-tests.py
      # Gate proofs and contract suites omitted from CI (#737).
      - run: python3 scripts/tests/test_wb_notice_button_mapping.py
      - run: python3 scripts/lib/tuna-datetime-proof-tests.py
      - run: python3 scripts/lib/test_tuna_sound_consumers_proof.py
      - run: python3 scripts/lib/tuna-wellbeing-action-proof-tests.py
      - run: python3 scripts/lib/tuna-wellbeing-probe-bind-tests.py
      - run: python3 scripts/lib/xkeycode-tap-tests.py
      - run: /usr/bin/python3 scripts/tests/test_night_light_reader_contract.py
      - name: Check benchmark export provenance and owned resource cleanup
        run: |
          /usr/bin/python3 scripts/lib/tuna-benchmark-disk-tests.py
          /usr/bin/python3 scripts/lib/tuna-benchmark-esp-tests.py
          /usr/bin/python3 scripts/lib/tuna-corral-ssh-export-tests.py
      - run: python3 scripts/lib/tuna-perf-repeatability-tests.py
      - run: python3 scripts/lib/tuna-perf-gate-tests.py
      - run: python3 scripts/lib/perf-operation-budget-tests.py
      # Performance budgets only ratchet tighter; any change cites a run and
      # loosening needs an ADR (docs/perf/README.md, roadmap change control).
      - name: Check the performance budget ratchet
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git cat-file -e FETCH_HEAD:docs/perf/budgets.json 2>/dev/null; then
            git show FETCH_HEAD:docs/perf/budgets.json > "$RUNNER_TEMP/base-budgets.json"
            scripts/tuna-perf-gate ratchet --base "$RUNNER_TEMP/base-budgets.json"
          else
            scripts/tuna-perf-gate validate
          fi
      - run: python3 scripts/lib/native-constraint-tests.py
      - run: python3 scripts/lib/window-menu-fixture-tests.py
      - run: python3 scripts/lib/focus-points-tests.py
      - run: python3 scripts/lib/tuna-pipewire-dump-tests.py
      - run: python3 scripts/lib/tuna-fade-match-tests.py
      - run: python3 scripts/lib/gtk-privacy-portal-proof-tests.py
      - run: python3 scripts/lib/gnome-brightness-tests.py
      - run: scripts/tuna-settings-inventory-check
      - name: Verify bundled cursor assets and rejection checks
        run: |
          scripts/tuna-cursor-assets-check share/tuna-desktop/icons/Adwaita
          python3 scripts/lib/cursor-assets-tests.py
      - run: /usr/bin/python3 scripts/tests/test_strip_endpoint.py
      - run: /usr/bin/python3 scripts/tests/test_fprint_phase_contract.py
      - name: Admit native Night Light GIO and schema compiler
        run: |
          pkg-config --atleast-version=2.66 gio-2.0 glib-2.0
          command -v glib-compile-schemas
          command -v timeout
      - run: /usr/bin/python3 scripts/tests/test_stock_slideshow_proof.py
      - run: cargo fmt --all -- --check
      - name: Check bounded EIS transport regression tests
        run: |
          cargo fmt --manifest-path third-party/reis/Cargo.toml --all -- --check
          cargo test --manifest-path third-party/reis/Cargo.toml --lib roost_transport_bounds
      - run: rustfmt --edition 2021 --check third-party/smithay/src/xwayland/xserver.rs third-party/smithay/src/backend/drm/surface/gbm.rs third-party/smithay/src/wayland/selection/data_device/dnd_grab.rs third-party/smithay/src/wayland/selection/data_device/mod.rs third-party/smithay/src/backend/renderer/gles/mod.rs third-party/smithay/src/backend/renderer/gles/texture.rs
      - run: cargo test --locked --manifest-path third-party/smithay/Cargo.toml --no-default-features --features xwayland,wayland_frontend prepared_socket
      - run: cargo test --locked --manifest-path third-party/smithay/Cargo.toml --no-default-features --features xwayland,wayland_frontend --lib cancellation_tests
      # GL tests on surfaceless Mesa (llvmpipe); libegl1/libgl1-mesa-dri above.
      - run: cargo test --locked --manifest-path third-party/smithay/Cargo.toml --no-default-features --features renderer_gl --lib per_frame_read_fence
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Supply-chain gate (#564): fails on RUSTSEC advisories with fixes.
      # Warnings (unmaintained/unsound notices) stay advisory until the
      # zbus/zvariant/cgmath triage lands — see #564.
      - name: Test the tokenless security gate
        run: |
          # pull_request runs the merge-ref workflow against the exact head.
          # Older heads may predate this self-test; their audit stays required.
          if [[ -f scripts/tests/test_ci_security_audit.py ]]; then
            python3 scripts/tests/test_ci_security_audit.py
          else
            echo '::notice::Security gate self-test is absent on this older candidate; the locked dependency audit remains required.'
          fi
      # A standalone CLI needs no Checks API write access, including on forks.
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        # Inline so the merge-ref workflow can audit a head predating its wrapper.
        run: cargo audit --file "$GITHUB_WORKSPACE/Cargo.lock"
      # pam_wrapper runs the lock screen's PAM path for real (#62); it is
      # required here so the test can never silently skip.
      - run: cargo test --workspace
        env:
          TUNA_REQUIRE_PAM_WRAPPER: "1"
          # The lockdown round trip (#357) needs the installed schema.
          TUNA_REQUIRE_LOCKDOWN_SCHEMA: "1"
      - name: Prove private PAM helper conversations and retirement
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/private-pam-helper-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/private-pam-helper-proof/source.txt"
          sha256sum crates/compositor/src/pam_helper.rs crates/compositor/src/main.rs crates/compositor/tests/pam_helper.rs crates/compositor/tests/fixtures/pam_conversation.c > "$RUNNER_TEMP/private-pam-helper-proof/source-sha256.txt"
          cargo test --locked -p tuna-compositor --test pam_helper -- --exact private_pam_helper_actual_binary_conversation_and_retirement --nocapture 2>&1 | tee "$RUNNER_TEMP/private-pam-helper-proof/test.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/private-pam-helper-proof/test.log"
          grep -Eq '^private PAM helper executable sha256: [a-f0-9]{64}$' "$RUNNER_TEMP/private-pam-helper-proof/test.log"
        env:
          TUNA_REQUIRE_PAM_WRAPPER: "1"
      - name: Retain private PAM helper proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: private-pam-helper-proof
          path: ${{ runner.temp }}/private-pam-helper-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Shortcut inhibition consent proof
        run: scripts/tuna-shortcut-proof
      # Every listed test just passed: the parity-ledger job resolves
      # the ledger's cargo:<name> references against this list.
      - run: cargo test --workspace -q -- --list --format terse > test-list.txt
      - run: scripts/tuna-test-strategy --test-list test-list.txt --report test-strategy-report.md
      - run: python3 scripts/lib/victory-signal-tests.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: executed-test-strategy-report
          path: test-strategy-report.md
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-list
          path: test-list.txt
          retention-days: 14


  fprint-phase-proof:
    # Required measured transport phases; not a live UI/hardware qualification.
    runs-on: ubuntu-latest
    needs: [select-lanes, check]
    if: contains(fromJSON(needs.select-lanes.outputs.lanes), 'fprint-phase-proof')
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-fprint
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Identify native cache platform
        id: cache-platform
        run: |
          . /etc/os-release
          echo "distro=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ steps.cache-platform.outputs.distro }}
          workspaces: . -> target/ci-fprint
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: sudo apt-get update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev pkg-config libpipewire-0.3-dev libclang-dev dbus
      - name: Admit exact compiled roles and require positive measured public phase
        run: scripts/tuna-fprint-phase-proof --artifacts "$RUNNER_TEMP/fprint-phase-proof"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fprint-phase-proof
          path: |
            ${{ runner.temp }}/fprint-phase-proof/*.json
            ${{ runner.temp }}/fprint-phase-proof/*.txt
          retention-days: 14

  journey:
    runs-on: ubuntu-26.04
    needs: [select-lanes]
    if: contains(fromJSON(needs.select-lanes.outputs.lanes), 'journey')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Identify native cache platform
        id: cache-platform
        run: |
          . /etc/os-release
          echo "distro=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ steps.cache-platform.outputs.distro }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      # Nested session needs a display plus X input/capture tools; the
      # journey asserts liveness and visible reaction, humans review
      # the uploaded frames.
      # libxkbcommon-x11 and EGL are dlopened at winit-backend startup
      # (not at build time), so the nested run needs them even though
      # check does not. Mesa swrast provides software GL on runners.
      # The shell's gio settings read needs glib dev files at build
      # time (check gets them transitively via GTK).
      # Genuine Ubuntu26.04 distro packages, not /usr/local source libraries.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y --no-install-recommends libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool scrot ffmpeg jq dbus libglib2.0-bin xwayland x11-apps x11-utils pipewire wireplumber gstreamer1.0-pipewire gstreamer1.0-tools gstreamer1.0-plugins-good at-spi2-core python3-pyatspi python3-pil libnotify-bin libsecret-tools gnome-keyring fonts-cantarell shellcheck libglib2.0-dev libgtk-4-dev libfontconfig1-dev librsvg2-common libpipewire-0.3-dev libadwaita-1-dev meson ninja-build libwayland-dev wayland-protocols libpam-wrapper ibus ibus-gtk3 ibus-gtk4 gir1.2-ibus-1.0 gir1.2-gtk-3.0 wayland-utils xdg-desktop-portal xdg-desktop-portal-gnome xdg-desktop-portal-gtk libgtk4-layer-shell-dev dpkg-dev gsettings-desktop-schemas build-essential desktop-file-utils
      - run: pkg-config --atleast-version=1.1 gtk4-layer-shell-0 && pkg-config --atleast-version=4.12 gtk4 && pkg-config --atleast-version=1.0 libadwaita-1
      - run: shellcheck -x scripts/tuna-journey scripts/tuna-nested scripts/tuna-release scripts/check-release-package scripts/check-deb-clean-install scripts/lib/tuna-introspect.sh scripts/lib/tuna-proof-session-launch scripts/ci-prepare-artifacts
      - run: python3 scripts/lib/installed-deb-proof-tests.py
      - run: python3 scripts/lib/release-deb-ownership-tests.py
      - run: python3 scripts/lib/deb-clean-install-tests.py
      - run: python3 scripts/lib/transition-package-policy-tests.py
      - run: python3 scripts/lib/legacy-upgrade-evidence-tests.py
      - run: scripts/tuna-release --allow-dirty --out package-artifacts && scripts/check-release-package package-artifacts/*.deb
      # Install with declared dependencies in a clean distro image; runner
      # development libraries must not conceal missing package dependencies.
      - run: scripts/check-deb-clean-install package-artifacts/*.deb ubuntu:26.04
      - name: Qualify disposable Debian lifecycle and private PAM mechanisms
        run: |
          mkdir -p upgrade-artifacts
          curl --fail --location --retry 3 \
            https://github.com/tuna-os/tuna-desktop/releases/download/v1.0.0-beta.1/tuna-desktop_1.0.0.beta.1_amd64.deb \
            --output "$RUNNER_TEMP/tuna-legacy-beta.deb"
          echo "b2b9ec7c9c5eb9f0e2003e48e458a440a551836d31a831972b8561a43e15ed01  $RUNNER_TEMP/tuna-legacy-beta.deb" | sha256sum --check
          # All installs and PAM configuration stay in fresh private roots in
          # this disposable container. After teardown, export only a bounded,
          # payload-free result projection; private fixtures stay inaccessible
          # to the runner. No package binaries or hooks are run.
          docker run --rm -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/source:ro" \
            -v "$RUNNER_TEMP/tuna-legacy-beta.deb:/beta.deb:ro" \
            -v "$PWD/upgrade-artifacts:/artifacts" ubuntu:26.04 sh -euc '
              apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
              apt-get install -y --no-install-recommends python3 build-essential libpam0g-dev libpam-modules
              set -- /source/package-artifacts/*.deb
              [ "$#" -eq 1 ]
              python3 /source/scripts/lib/legacy-upgrade-evidence.py \
                --candidate "$1" --beta /beta.deb --output /artifacts
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: legacy-upgrade-mechanisms
          path: upgrade-artifacts/legacy-upgrade-results.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tuna-deb
          path: package-artifacts/
          retention-days: 14
      - run: scripts/tuna-journey --artifacts journey-artifacts
      - name: Install exact Debian-format candidate and isolated companion fixtures
        run: |
          sudo apt-get install -y --no-install-recommends ./package-artifacts/*.deb
          cargo build --locked --release -p tuna-compositor --example icon-probe --example shortcut-inhibit-client
          mkdir -p package-artifacts/installed
          cp /etc/os-release package-artifacts/installed/os-release
          dpkg-query -W > package-artifacts/installed/dpkg-versions.txt
          apt-cache policy libgtk4-layer-shell0 libgtk-4-1 libadwaita-1-0 > package-artifacts/installed/apt-policy.txt
          sha256sum package-artifacts/*.deb > package-artifacts/installed/package.sha256
          sudo install -d -m0755 /usr/libexec/tuna-deb-proof
          sudo install -m0755 target/release/examples/icon-probe target/release/examples/shortcut-inhibit-client /usr/libexec/tuna-deb-proof/
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('target/release/examples')
          value = {'commit': os.environ['GITHUB_SHA'], 'files': {name: hashlib.sha256((root/name).read_bytes()).hexdigest() for name in ('icon-probe', 'shortcut-inhibit-client')}}
          Path('package-artifacts/installed/companions.json').write_text(json.dumps(value) + '\n')
          PY
          sudo install -m0644 package-artifacts/installed/companions.json /usr/libexec/tuna-deb-proof/provenance.json
      - name: Qualify the actual installed preferred GTK session
        run: |
          export HOME="$RUNNER_TEMP/tuna-deb-home"
          mkdir -p "$HOME"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/tuna-deb-runtime"
          mkdir -m0700 "$XDG_RUNTIME_DIR"
          unset WAYLAND_DISPLAY WAYLAND_SOCKET TUNA_SHELL_BIN TUNA_PROOF_SHELL_BIN LD_LIBRARY_PATH
          scripts/tuna-gtk-shell-proof --installed-package --artifacts package-artifacts/installed/controls
        env:
          TUNA_REQUIRE_PAM_WRAPPER: "1"
          TUNA_REQUIRE_IBUS: "1"
          TUNA_REQUIRE_WAYLAND_INFO: "1"
      # FIFOs and sockets left by the proofs make the zipper warn
      # ENTRYNOTSUPPORTED and drop them (#484); list and remove them first.
      - if: always()
