  arch-package:
    # TunaOS Marlin is Arch-based: build, check, and install the Arch
    # package in a clean archlinux container (#69).
    runs-on: ubuntu-latest
    needs: [select-lanes]
    if: contains(fromJSON(needs.select-lanes.outputs.lanes), 'arch-package')
    timeout-minutes: 40
    container: archlinux:latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust pkgconf clang pipewire gtk4 gtk4-layer-shell libadwaita libsecret libcanberra sound-theme-freedesktop libxkbcommon libxkbcommon-x11 mesa wayland dbus glib2 gnome-settings-daemon gnome-session seatd libinput systemd-libs libdrm librsvg glycin gdk-pixbuf2 fontconfig adwaita-fonts namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Identify Arch native build environment
        id: arch-native
        shell: bash
        run: |
          # Keep registry manifests outside the workspace: rust-cache treats
          # all manifests below it as local crates and excludes them by default.
          export CARGO_HOME="$RUNNER_TEMP/ci-arch-cargo"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/ci-arch"
          printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\n' "$CARGO_HOME" "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          native_key=$( { cat /etc/os-release; pacman -Q; } | sha256sum | cut -d ' ' -f 1)
          printf 'key=%s\n' "$native_key" >> "$GITHUB_OUTPUT"
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: arch-container-v2-${{ steps.arch-native.outputs.key }}
          workspaces: . -> target/ci-arch
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE" "$CARGO_HOME"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && CARGO_HOME='$CARGO_HOME' CARGO_TARGET_DIR='$CARGO_TARGET_DIR' RUSTUP_TOOLCHAIN=stable TUNA_LOCAL_SRC='$GITHUB_WORKSPACE' makepkg -f --noconfirm"
      - run: |
          pkg=$(ls packaging/arch/tuna-desktop-[0-9]*.pkg.tar.zst)
          namcap "$pkg" || true
          pacman -U --noconfirm "$pkg"
          for bin in tuna-compositor tuna-session tuna-shell-host tuna-greeter tuna-wallpaper-svg; do "$bin" --version; done
          test -f /usr/share/wayland-sessions/tuna.desktop
          # Exact temporary bridge: installed-layout proof, not an upgrade test.
          for path in /usr/share/wayland-sessions/roost.desktop /etc/pam.d/roost-lock; do  # tuna-rename: keep
            test -f "$path" && test ! -L "$path"
          done
          legacy=$(find /usr/bin /usr/share/wayland-sessions /etc/pam.d -maxdepth 1 -iname '*roost*' -print | LC_ALL=C sort)  # tuna-rename: keep
          expected=$(printf '%s\n' /etc/pam.d/roost-lock /usr/share/wayland-sessions/roost.desktop)  # tuna-rename: keep
          test "$legacy" = "$expected"
          mkdir -p arch-artifacts && cp "$pkg" arch-artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tuna-arch
          path: arch-artifacts/
          retention-days: 14

  marlin-image:
    # Tuna Desktop layered on ghcr.io/tuna-os/marlin:gnome (GNOME 51 baseline
    # image) as a nested preview. Built when selected (every main run),
    # pushed from main.
    runs-on: ubuntu-latest
    # Do not publish a package image before the workspace check succeeds.
    needs: [select-lanes, check, arch-package]
    if: contains(fromJSON(needs.select-lanes.outputs.lanes), 'marlin-image')
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tuna-arch
          path: arch-artifacts
      - name: Free disk for the Marlin base image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: |
          pkg=$(ls arch-artifacts/tuna-desktop-[0-9]*.pkg.tar.zst)
          cp "$pkg" ./tuna.pkg.tar.zst
          podman build -f packaging/marlin/Containerfile \
            --build-arg TUNA_PKG=tuna.pkg.tar.zst \
            -t marlin-tuna-preview:ci .
          podman run --rm marlin-tuna-preview:ci tuna-compositor --version
          podman run --rm marlin-tuna-preview:ci test -f /usr/share/applications/tuna-nested-preview.desktop
          mkdir -p marlin-image-kernels
          kernel_container=$(podman create marlin-tuna-preview:ci /usr/bin/true)
          trap 'podman rm "$kernel_container"' EXIT
          podman cp "$kernel_container:/usr/share/tuna-image-kernels/." marlin-image-kernels/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: marlin-image-kernels
          path: marlin-image-kernels/
          retention-days: 14
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/tuna-os/tuna-desktop/marlin-tuna-preview
          podman tag marlin-tuna-preview:ci "$img:latest"
          podman tag marlin-tuna-preview:ci "$img:${{ github.sha }}"
          podman push "$img:latest"
          podman push "$img:${{ github.sha }}"

  marlin-vm:
    # Real-VM lane (#68): install the Marlin Tuna Desktop image (plus the CI-only
    # autologin/serial-journal layer in packaging/marlin/vm-lane) to a
    # raw disk with bootc, boot it in QEMU/KVM, and prove greetd starts
    # the Tuna Desktop hardware session on the DRM/KMS backend. The image is
    # rebuilt rootful here (bootc install reads it from root's storage),
    # in parallel with marlin-image rather than after it.
    name: ${{ matrix.orca == 'distribution' && 'marlin-vm' || 'marlin-vm-orca51' }}
    strategy:
      fail-fast: false
      matrix:
        orca: [distribution, upstream51]
    runs-on: ubuntu-26.04
    needs: [select-lanes, arch-package]
    if: contains(fromJSON(needs.select-lanes.outputs.lanes), 'marlin-vm')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tuna-arch
          path: arch-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Free disk for the image and the raw disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo mkdir -p /mnt/vm && sudo chown "$(id -u):$(id -g)" /mnt/vm
          df -h / /mnt
      - run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf ffmpeg python3-pil fonts-dejavu-core zstd
      - name: Build the Marlin Tuna Desktop image and the VM test layer
        run: |
          cp arch-artifacts/tuna-desktop-[0-9]*.pkg.tar.zst ./tuna.pkg.tar.zst
          sudo podman build -f packaging/marlin/Containerfile \
            --build-arg TUNA_PKG=tuna.pkg.tar.zst \
            --build-arg "TUNA_PKG_SHA256=$(sha256sum tuna.pkg.tar.zst | cut -d' ' -f1)" \
            -t localhost/marlin-tuna-preview:ci .
          sudo podman build -f packaging/marlin/vm-lane/Containerfile \
            -t localhost/marlin-tuna-vm:ci .
          if [[ '${{ matrix.orca }}' == upstream51 ]]; then
            sudo podman build -f packaging/marlin/vm-lane/orca51/Containerfile \
              -t localhost/marlin-tuna-vm-orca51:ci .
            sudo podman tag localhost/marlin-tuna-vm-orca51:ci localhost/marlin-tuna-vm:ci
            mkdir -p orca51-package-provenance
            probe_container=$(sudo podman create localhost/marlin-tuna-vm:ci /usr/bin/true)
            sudo podman cp "$probe_container:/usr/share/tuna-vm-orca51/." orca51-package-provenance/
            sudo podman rm "$probe_container"
            sudo chown -R "$(id -u):$(id -g)" orca51-package-provenance
          fi
          sudo podman image inspect ghcr.io/tuna-os/marlin:gnome --format '{{.Digest}}' | tee /mnt/vm/base-digest
          sudo podman image inspect localhost/marlin-tuna-vm:ci --format '{{.Id}}' > /mnt/vm/image-id-observed
          scripts/tuna-vm-strip-image --canonical-image-id "$(cat /mnt/vm/image-id-observed)" | tee /mnt/vm/image-id
          mkdir -p vm-lane-artifacts/image-kernels
          cp /mnt/vm/image-id-observed /mnt/vm/image-id vm-lane-artifacts/
          kernel_container=$(sudo podman create localhost/marlin-tuna-vm:ci /usr/bin/true)
          trap 'sudo podman rm "$kernel_container"' EXIT
          sudo podman cp "$kernel_container:/usr/share/tuna-image-kernels/." vm-lane-artifacts/image-kernels/
          sudo chown -R "$(id -u):$(id -g)" vm-lane-artifacts/image-kernels
          sudo podman run --rm localhost/marlin-tuna-vm:ci sh -c 'bootc --version; ls -ld /home; ls /usr/lib/bootc/install/ && cat /usr/lib/bootc/install/*' || true
          df -h / /mnt
      - name: Bind installed acceptance to the original package and immutable final image
        run: |
          image_id=$(cat /mnt/vm/image-id)
          owned_container="tuna-strip-inspect-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'sudo podman rm -f "$owned_container" >/dev/null 2>&1 || true' EXIT
          scripts/tuna-vm-strip-image --inspection-program > /mnt/vm/strip-inspect.py
          timeout --kill-after=5s 60s sudo podman run --rm --name "$owned_container" -i \
            --entrypoint /usr/bin/python3 "$image_id" - "$image_id" \
            < /mnt/vm/strip-inspect.py > /mnt/vm/strip-image-observed.json
          scripts/tuna-vm-strip-image --package tuna.pkg.tar.zst \
            --observed /mnt/vm/strip-image-observed.json --commit "$GITHUB_SHA" \
            --image-id "$image_id" \
            --base-image "ghcr.io/tuna-os/marlin:gnome@$(cat /mnt/vm/base-digest)" \
            --out vm-lane-artifacts/strip-image.json
      - name: Install the image to a raw disk with bootc
        run: |
          # Marlin boots with systemd-boot, not bootupd, so it installs
          # on bootc's composefs backend; a sealed composefs root needs
          # fs-verity, which the image's default xfs lacks. Probed from
          # the image the way tuna-os/tunaOS scripts/lib/backend.sh does.
          args=""
          probe='
            if ls /usr/lib/bootupd/updates/EFI/*/grub*.efi >/dev/null 2>&1; then :
            elif grep -A8 "^\[composefs\]" /usr/lib/ostree/prepare-root.conf 2>/dev/null | grep -qiE "enabled[[:space:]]*=[[:space:]]*(yes|true|1|signed)" \
              || find /usr/lib/systemd/boot/efi -name "systemd-boot*.efi" 2>/dev/null | grep -q .; then echo --composefs-backend; fi
            grep -A8 "^\[composefs\]" /usr/lib/ostree/prepare-root.conf 2>/dev/null | grep -qiE "enabled[[:space:]]*=[[:space:]]*(yes|true|1|signed)" && echo "--filesystem ext4" || true'
          args=$(sudo podman run --rm --entrypoint "" localhost/marlin-tuna-vm:ci sh -c "$probe" | tr '\n' ' ')
          echo "bootc install extra args: $args"
          truncate -s 20G /mnt/vm/disk.raw
          # shellcheck disable=SC2086 # $args is a word list on purpose
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v /mnt/vm:/output \
            localhost/marlin-tuna-vm:ci \
            bootc install to-disk --via-loopback --generic-image --wipe $args /output/disk.raw
          sudo chown "$(id -u):$(id -g)" /mnt/vm/disk.raw
          sudo podman rmi -a -f >/dev/null 2>&1 || true
          df -h / /mnt
      # After the assertions, --tour drives a scripted feature tour
      # through QMP input and records it to tour/tuna-tour.webm.
      - name: Boot the disk, assert the Tuna Desktop hardware session, record the tour
        run: >-
          scripts/tuna-vm-lane --disk /mnt/vm/disk.raw --out vm-lane-artifacts --boots 5 --tour --orca-contract ${{ matrix.orca }}
          --strip-image vm-lane-artifacts/strip-image.json --strip-edge
          --meta "base_image=ghcr.io/tuna-os/marlin:gnome@$(cat /mnt/vm/base-digest)"
          --meta "test_image_id=$(cat /mnt/vm/image-id)"
          --meta "tuna_package=$(basename arch-artifacts/tuna-desktop-[0-9]*.pkg.tar.zst)"
          --meta "commit=${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ matrix.orca == 'distribution' && 'marlin-vm' || 'marlin-vm-orca51' }}
          path: |
            vm-lane-artifacts/
            !vm-lane-artifacts/tour/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ matrix.orca == 'distribution' && 'tuna-tour' || 'tuna-tour-orca51' }}
          path: vm-lane-artifacts/tour/
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && matrix.orca == 'upstream51'
        with:
          name: orca51-package-provenance
          path: orca51-package-provenance/
          if-no-files-found: error
          retention-days: 14

  parity-ledger:
    # GNOME 51 parity ledger gate (#66): every row marked pass must cite
    # tests, and every cited cargo test / journey assertion must have
    # passed in this run.
    runs-on: ubuntu-latest
    needs: [select-lanes, check, journey, greeter, gtk-shell, drm-smoke, marlin-vm]
    if: contains(fromJSON(needs.select-lanes.outputs.lanes), 'parity-ledger')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-list
          path: ledger-in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: journey-shots
          path: ledger-in/journey
      - name: Require the successful GTK job's proof artifact
        env:
          GTK_PROOF_ARTIFACT_ID: ${{ needs.gtk-shell.outputs.proof_artifact_id }}
        run: '[[ "$GTK_PROOF_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.gtk-shell.outputs.proof_artifact_id }}
          path: ledger-in/gtk-shell
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: drm-smoke
          path: ledger-in/drm-smoke
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: marlin-vm
          path: ledger-in/marlin-vm
      - run: >-
          scripts/tuna-ledger check --tests ledger-in/test-list.txt
          --assertions ledger-in/journey/assertions.txt
          --assertions ledger-in/gtk-shell/assertions.txt
          --assertions ledger-in/gtk-shell/a11y/assertions.txt
          --assertions ledger-in/gtk-shell/scale/assertions.txt
          --assertions ledger-in/gtk-shell/magnifier/assertions.txt
          --assertions ledger-in/gtk-shell/session-restore/assertions.txt
          --assertions ledger-in/gtk-shell/osk/assertions.txt
          --assertions ledger-in/drm-smoke/assertions.txt
          --assertions ledger-in/marlin-vm/assertions.txt

  docs-shots:
    runs-on: ubuntu-latest
    needs: [select-lanes, journey, app-content, scroll-proof]
    if: contains(fromJSON(needs.select-lanes.outputs.lanes), 'docs-shots')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Curate a screenshot set out of this run's own proof artifacts
      # and upload it as one bundle. Nothing is committed from it: the
      # docs use the walkthrough (docs/walkthrough.md), which the GTK
      # shell proof captures.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: journey-shots
          path: /tmp/tuna-docs/journey
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-content-shots
          path: /tmp/tuna-docs/app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: scroll-proof-shots
          path: /tmp/tuna-docs/scroll
      - run: shellcheck scripts/tuna-docs-shots
      - run: |
          scripts/tuna-docs-shots collect /tmp/tuna-docs/journey /tmp/tuna-docs/app /tmp/tuna-docs/scroll --dest /tmp/tuna-docs/shots
          python3 -c 'from pathlib import Path; assert len(list(Path("/tmp/tuna-docs/shots").iterdir())) == 7'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-shots
          path: /tmp/tuna-docs/shots/
          retention-days: 90

  ci-gate:
    # One stable status for the run: lanes the selection skipped report
    # skipped, any failed or cancelled job fails the gate.
    if: always()
    needs: [select-lanes, check, fprint-phase-proof, journey, app-content, scroll-proof, drm-smoke, grid-cancel-comparison, greeter, gtk-shell, portal-security, remote-security, niri-parity, arch-package, marlin-image, marlin-vm, parity-ledger, docs-shots]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e '.["select-lanes"].result == "success" and .check.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$RESULTS" >/dev/null
