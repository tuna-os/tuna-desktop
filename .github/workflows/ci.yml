          with (artifacts / 'output.txt').open('w') as output:
              result = subprocess.run(argv, stdout=output, stderr=subprocess.STDOUT, check=False)
          (artifacts / 'receipt.json').write_text(json.dumps({'build_admission': admission, 'argv': argv, 'exit_status': result.returncode, 'scope': 'real GTK callbacks and in-memory native notification center; installed pointer/layer-shell qualification pending'}, indent=2) + '\n')
          output_text = (artifacts / 'output.txt').read_text()
          print(output_text)
          assert result.returncode == 0, 'notification lifecycle proof failed'
          assert 'running 1 test' in output_text and '1 passed; 0 failed; 0 ignored;' in output_text, 'expected lifecycle test did not execute'
          PY
      - name: Prove real GTK countdown OSD ownership and cancellation
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib, json, os, pathlib, signal, subprocess
          admission = json.loads(pathlib.Path('gtk-shell-artifacts/a11y/bin/build-admission.json').read_text())
          expected = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'cargo_lock_sha256': hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest(), 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          if any(admission.get(key) != value for key, value in expected.items()):
              raise RuntimeError('countdown proof requires this source, lock, run and attempt')
          binary = pathlib.Path(admission['admitted_executable']).resolve()
          if admission['executable_sha256'] != hashlib.sha256(binary.read_bytes()).hexdigest():
              raise RuntimeError('countdown proof executable differs from Cargo admission')
          artifacts = pathlib.Path('gtk-shell-artifacts/countdown')
          artifacts.mkdir(parents=True, exist_ok=False)
          argv = ['env', '-u', 'WAYLAND_DISPLAY', '-u', 'WAYLAND_SOCKET', 'dbus-run-session', '--', 'xvfb-run', '-a', 'env', 'GDK_BACKEND=x11', 'TUNA_REQUIRE_COUNTDOWN_OSD=1', str(binary), 'osd::gtk_countdown_tests::actual_gtk_stop_countdown_preserves_newer_osd_and_timers', '--exact', '--ignored', '--test-threads=1', '--nocapture']
          with (artifacts / 'output.txt').open('w') as output:
              child = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=output, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  exit_status = child.wait(timeout=30)
              except subprocess.TimeoutExpired:
                  exit_status = 124
                  os.killpg(child.pid, signal.SIGTERM)
                  try:
                      child.wait(timeout=3)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid, signal.SIGKILL)
                      child.wait(timeout=3)
          text = (artifacts / 'output.txt').read_text()
          unchanged = admission['executable_sha256'] == hashlib.sha256(binary.read_bytes()).hexdigest()
          (artifacts / 'receipt.json').write_text(json.dumps({'build_admission': admission, 'argv': argv, 'exit_status': exit_status, 'executable_unchanged_after': unchanged, 'output_sha256': hashlib.sha256((artifacts / 'output.txt').read_bytes()).hexdigest(), 'scope': 'actual GTK production countdown hooks, widget visibility and GLib timers under private X11; Wayland layer-shell and installed DRM qualification pending'}, indent=2) + '\n')
          if exit_status != 0 or not unchanged or '1 passed; 0 failed; 0 ignored' not in text or 'COUNTDOWN-OSD pass ' not in text:
              raise RuntimeError('actual admitted countdown OSD test did not pass')
          PY
      - name: Prove real GTK OSD fade-out, panel menu close/switch (#501) and lock curtain (#502)
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib, json, os, pathlib, signal, subprocess
          admission = json.loads(pathlib.Path('gtk-shell-artifacts/a11y/bin/build-admission.json').read_text())
          expected = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'cargo_lock_sha256': hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest(), 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          if any(admission.get(key) != value for key, value in expected.items()):
              raise RuntimeError('transient proof requires this source, lock, run and attempt')
          binary = pathlib.Path(admission['admitted_executable']).resolve()
          if admission['executable_sha256'] != hashlib.sha256(binary.read_bytes()).hexdigest():
              raise RuntimeError('transient proof executable differs from Cargo admission')
          proofs = [
              ('osd-fade', 'TUNA_REQUIRE_OSD_FADE=1', 'osd::gtk_fade_tests::actual_gtk_show_during_fade_out_lets_the_fade_complete', 'OSD-FADE-OUT pass ', 'actual GTK widgets, frame clock and GLib timers under private X11; Wayland layer-shell and the compositor-drawn close are proven by G-TRANSIENT-CLOSE-CLOCK'),
              ('menu-motion', 'TUNA_REQUIRE_MENU_MOTION=1', 'transient::gtk_menu_tests::actual_gtk_menus_close_at_once_and_switch_fade_only', 'MENU-MOTION pass ', 'actual GTK widgets, frame clock and GLib timers under private X11; Wayland layer-shell and the compositor-drawn close are proven by G-TRANSIENT-CLOSE-CLOCK'),
              ('lock-curtain', 'TUNA_REQUIRE_LOCK_CURTAIN=1', 'lock_curtain::gtk_curtain_tests::actual_gtk_curtain_pages_follow_progress_and_policy', 'LOCK-CURTAIN pass ', 'actual GTK widget allocation, focus and frame clock under private X11; the session-lock surface, real input and frozen-clock frames are proven by G-LOCK-CURTAIN-CLOCK, G-LOCK-CURTAIN-POLICY and G-LOCK-CURTAIN-DRAG'),
          ]
          for name, admit, test, marker, scope in proofs:
              artifacts = pathlib.Path('gtk-shell-artifacts') / name
              artifacts.mkdir(parents=True, exist_ok=False)
              argv = ['env', '-u', 'WAYLAND_DISPLAY', '-u', 'WAYLAND_SOCKET', 'dbus-run-session', '--', 'xvfb-run', '-a', 'env', 'GDK_BACKEND=x11', admit, str(binary), test, '--exact', '--ignored', '--test-threads=1', '--nocapture']
              with (artifacts / 'output.txt').open('w') as output:
                  child = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=output, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      exit_status = child.wait(timeout=30)
                  except subprocess.TimeoutExpired:
                      exit_status = 124
                      os.killpg(child.pid, signal.SIGTERM)
                      try:
                          child.wait(timeout=3)
                      except subprocess.TimeoutExpired:
                          os.killpg(child.pid, signal.SIGKILL)
                          child.wait(timeout=3)
              text = (artifacts / 'output.txt').read_text()
              print(text)
              unchanged = admission['executable_sha256'] == hashlib.sha256(binary.read_bytes()).hexdigest()
              (artifacts / 'receipt.json').write_text(json.dumps({'build_admission': admission, 'argv': argv, 'exit_status': exit_status, 'executable_unchanged_after': unchanged, 'output_sha256': hashlib.sha256((artifacts / 'output.txt').read_bytes()).hexdigest(), 'scope': scope}, indent=2) + '\n')
              if exit_status != 0 or not unchanged or '1 passed; 0 failed; 0 ignored' not in text or marker not in text:
                  raise RuntimeError(f'actual admitted {name} test did not pass')
          PY
      - name: Prove real MediaKeys callback completion and forced clamp interleave
        run: |
          /usr/bin/python3 scripts/tuna-media-completion-proof --admission gtk-shell-artifacts/a11y/bin/build-admission.json --cargo-json "$RUNNER_TEMP/tuna-gtk-a11y-build.json" --artifacts gtk-shell-artifacts/media-completion
      # pam_wrapper backs G-UNLOCK, IBus G-IME and wayland-utils
      # G-WAYLAND-INFO; all required so no stage can silently skip.
      - run: python3 scripts/lib/cursor-proof-theme-tests.py
      - run: python3 scripts/lib/cursor-pixels-tests.py
      - run: /usr/bin/python3 scripts/lib/wellbeing-pixels-tests.py
      - run: /usr/bin/python3 scripts/lib/gtk-folder-watch-proof-tests.py
      - run: /usr/bin/python3 scripts/lib/lock-curtain-proof-tests.py
      - run: /usr/bin/python3 scripts/lib/gsd-media-keys-bus-tests.py
      - run: scripts/tuna-gtk-shell-proof --artifacts gtk-shell-artifacts
        env:
          TUNA_REQUIRE_PAM_WRAPPER: "1"
          TUNA_REQUIRE_IBUS: "1"
          TUNA_REQUIRE_WAYLAND_INFO: "1"
          TUNA_REQUIRE_GSD_MEDIA_KEYS: "1"
      # Native/X11 geometry and physical input at all required virtual scales.
      - run: |
          for scale in 1 1.25 1.5 2; do
            scripts/tuna-scale-proof --scale "$scale" --artifacts "gtk-shell-artifacts/scale-$scale"
          done
          mkdir -p gtk-shell-artifacts/scale
          cat gtk-shell-artifacts/scale-*/assertions.txt > gtk-shell-artifacts/scale/assertions.txt
      # dbus-daemon semantics: portal activation hangs instead of failing
      # fast, and the shell must still own org.gnome.Shell promptly.
      - run: scripts/tuna-slow-portal-proof --artifacts gtk-shell-artifacts/slow-portal
      # Screen magnifier (#349): real GSettings writes, magnified pixels
      # in shell screenshot captures and live output frames. Independent
      # of the shell proof above, so it runs (and gates) even when that
      # one already failed the job.
      - if: ${{ !cancelled() }}
        run: shellcheck scripts/tuna-magnifier-proof && scripts/tuna-magnifier-proof --artifacts gtk-shell-artifacts/magnifier
      # Window session save and restore (P-SY-08, #338): an
      # xdg-session-management client's windows come back, moved, resized,
      # maximized and on their workspace, after the nested compositor
      # restarts (G-SESSION-RESTORE*).
      - run: scripts/tuna-session-restore-proof --artifacts gtk-shell-artifacts/session-restore
      # On-screen keyboard (#349): real clicks into a GTK entry and on the
      # shell's keys (found in its AT-SPI tree), the client's text read
      # back, and the lock screen's own keyboard unlocking through PAM.
      # Independent of the proofs above, so it runs (and gates) even when
      # one of them already failed the job.
      - if: ${{ !cancelled() }}
        run: shellcheck scripts/tuna-osk-proof && scripts/tuna-osk-proof --artifacts gtk-shell-artifacts/osk
      # Keep runnable binaries even when a later live proof assertion fails.
      - if: always()
        run: |
          mkdir -p gtk-shell-artifacts/bin
          cp target/debug/tuna-compositor target/debug/tuna-shell-gtk target/debug/tuna-wallpaper-svg gtk-shell-artifacts/bin/
          cp /usr/local/lib/*/libgtk4-layer-shell.so* gtk-shell-artifacts/bin/ 2>/dev/null || cp /usr/local/lib/libgtk4-layer-shell.so* gtk-shell-artifacts/bin/
      # G-WS-INSERT publishes the targeted insertion frame/state. Full
      # parity captures need native fonts, wallpapers and installed apps;
      # use the uploaded binaries with that reference on the capture host.

      # The feature walkthrough from this run's frames: every frame the
      # manifest names must still be taken, and the bundle is what a
      # docs refresh commits (scripts/tuna-walkthrough).
      - run: scripts/tuna-walkthrough build gtk-shell-artifacts --dest walkthrough
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: walkthrough
          path: walkthrough/
          retention-days: 90
      - if: always()
        run: scripts/ci-prepare-artifacts gtk-shell-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: gtk_artifact
        if: always()
        with:
          name: gtk-shell
          path: gtk-shell-artifacts/
          retention-days: 14

  portal-security:
    needs: [select-lanes, arch-package]
    if: contains(fromJSON(needs.select-lanes.outputs.lanes), 'portal-security')
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tuna-arch
          path: ${{ runner.temp }}/portal-package
      - run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get install -y --no-install-recommends podman zstd shellcheck
      - run: shellcheck scripts/tuna-portal-security tests/portal-reference/run.sh tests/portal-reference/settings-run.sh tests/portal-reference/global-shortcuts-run.sh tests/portal-reference/backgrounds-run.sh tests/portal-reference/slideshow-run.sh tests/portal-reference/svg-run.sh
      - run: python3 scripts/lib/tuna-portal-artifact-tests.py
      - run: python3 scripts/lib/tuna-svg-resource-tests.py
      - run: python3 scripts/lib/tuna-nautilus-readiness-tests.py
      - name: Test packaged compositor with actual GNOME 51 portal consent
        run: |
          mkdir -p "$RUNNER_TEMP/portal-candidate"
          package=$(find "$RUNNER_TEMP/portal-package" -name '*.pkg.tar.zst' -print -quit)
          test -n "$package"
          tar --zstd -xf "$package" -C "$RUNNER_TEMP/portal-candidate"
          mkdir -p "$RUNNER_TEMP/portal-security"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/portal-security/candidate-commit.txt"
          scripts/tuna-portal-security --candidate "$RUNNER_TEMP/portal-candidate" --out "$RUNNER_TEMP/portal-security"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: portal-security
          path: ${{ runner.temp }}/portal-security
          retention-days: 90

