name: Marlin performance samples
on:
  pull_request:
    paths:
      - .github/workflows/performance-baseline.yml
      - scripts/tuna-vm-perf
      - scripts/tuna-benchmark-disk-export
      - scripts/lib/tuna_benchmark_esp.py
      - scripts/lib/tuna_benchmark_kernel.py
      - scripts/lib/tuna-benchmark-esp-tests.py
      - scripts/lib/tuna_benchmark_disk.py
      - scripts/lib/tuna-benchmark-disk-tests.py
      - scripts/lib/tuna-benchmark-footprint-tests.py
      - scripts/lib/tuna_benchmark_footprint.py
      - scripts/lib/tuna_dense_decode.py
      - scripts/lib/tuna_dense_decode_worker.py
      - scripts/lib/tuna_dense_process.py
      - scripts/lib/tuna_dense_tool_identity.json
      - scripts/lib/tuna-dense-decode-tests.py
      - scripts/tuna-perf-profile-pairs
      - scripts/tuna-frame-pacer-build
      - scripts/lib/tuna-frame-pacer.c
      - scripts/lib/tuna-perf-*.py
      - scripts/lib/perf_vm_lifetime.py
      - scripts/lib/gnome_sysprof.py
      - scripts/lib/gnome_reference.py
      - scripts/lib/fixtures/sysprof-mark.*
      - scripts/lib/fixtures/gnome51-*
      - packaging/marlin/perf/**
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful ci run containing tuna-arch (empty selects latest main only)
        required: false
        type: string
      package_source:
        description: Trusted main package or explicitly dispatched exact-source candidate
        required: false
        type: choice
        default: main
        options: [main, candidate]
      export_disk:
        description: Export one compact external Corral/CDI benchmark disk
        required: false
        type: choice
        default: none
        options: [none, stock, diagnostic]
      export_disk_format:
        description: Distinct full RAW.gzip 20Gi contract or existing QCOW2 28Gi
        required: false
        type: choice
        default: qcow2
        options: [qcow2, raw-gzip]
      candidate_commit:
        description: Exact main or explicitly dispatched candidate package source SHA
        required: false
        type: string
      benchmark_ssh_public_key:
        description: One Ed25519 public key for the owned Corral benchmark guest
        required: false
        type: string
      export_only:
        description: Build/export the selected disk without running local QEMU measurements
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate compact disk export request
        env:
          EXPORT_ONLY: ${{ inputs.export_only }}
          EXPORT_DISK: ${{ inputs.export_disk }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          if [[ "$EXPORT_ONLY" == true && ( "$EXPORT_DISK" != stock && "$EXPORT_DISK" != diagnostic ) ]]; then
            echo 'export_only requires one explicit stock or diagnostic profile' >&2
            exit 2
          fi
          if [[ "$EXPORT_DISK" == stock || "$EXPORT_DISK" == diagnostic ]]; then
            [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'disk export requires exact candidate_commit' >&2; exit 2; }
          fi
      - run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get install -y python3-yaml
      - run: python3 scripts/lib/tuna-perf-tests.py
      - run: /usr/bin/python3 scripts/tests/test_corral_gzip.py
      - run: python3 scripts/lib/tuna-benchmark-disk-tests.py
      - run: python3 scripts/lib/tuna-benchmark-footprint-tests.py
      - run: python3 scripts/lib/tuna-dense-decode-tests.py
      - run: python3 scripts/lib/tuna-benchmark-esp-tests.py
      - run: /usr/bin/python3 scripts/lib/tuna-corral-ssh-export-tests.py
      - run: python3 scripts/lib/tuna-overview-receipt-tests.py
      - run: python3 scripts/lib/tuna-perf-repeatability-tests.py
      - run: python3 scripts/lib/tuna-perf-vm-lifetime-tests.py
      - run: python3 scripts/lib/tuna-perf-reference-tests.py
      - run: python3 scripts/lib/tuna-kernel-trace-tests.py
      - name: Select an explicitly qualified package source
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SOURCE: ${{ inputs.package_source }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          PACKAGE_RUN: ${{ inputs.package_run }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          mkdir -p perf-artifacts
          run="$PACKAGE_RUN"
          if [[ "$PACKAGE_SOURCE" == candidate ]]; then
            [[ "$WORKFLOW_EVENT" == workflow_dispatch && "$run" =~ ^[0-9]+$ && "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate requires explicit dispatched run and source SHA' >&2; exit 2; }
          fi
          if [[ -z "$run" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=20" > perf-artifacts/package-candidates-api.json
            run=$(python3 scripts/lib/tuna-perf-payload.py latest-run --runs perf-artifacts/package-candidates-api.json --repository "$GITHUB_REPOSITORY" --out perf-artifacts/package-candidate-selection.json)
          fi
          [[ "$run" =~ ^[0-9]+$ ]]
          printf '%s\n' "$run" > perf-artifacts/selected-package-run
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > perf-artifacts/package-run.json
          if [[ "$PACKAGE_SOURCE" != candidate ]]; then
            jq -e '.head_branch == "main" and .event == "push" and .conclusion == "success"' perf-artifacts/package-run.json
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=tuna-arch&per_page=100" > perf-artifacts/package-artifacts-api.json
          jq -e '.total_count <= 100 and (.artifacts | length) == .total_count and ([.artifacts[] | select(.name == "tuna-arch" and .expired == false)] | length) == 1' perf-artifacts/package-artifacts-api.json
          artifact=$(jq -r '.artifacts[] | select(.name == "tuna-arch" and .expired == false) | .id' perf-artifacts/package-artifacts-api.json)
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > perf-artifacts/package-artifact-api.json
          if [[ "$PACKAGE_SOURCE" == candidate ]]; then
            python3 scripts/lib/tuna-perf-payload.py select-candidate --repository "$GITHUB_REPOSITORY" --expected-sha "$CANDIDATE_COMMIT" --run-id "$run" --run perf-artifacts/package-run.json --artifact perf-artifacts/package-artifact-api.json --out perf-artifacts/package-selection.json
          else
            python3 scripts/lib/tuna-perf-payload.py select --run-id "$run" --run perf-artifacts/package-run.json --artifact perf-artifacts/package-artifact-api.json --out perf-artifacts/package-selection.json
          fi
          if [[ -n "$CANDIDATE_COMMIT" ]]; then
            [[ "$(jq -r '.head_sha' perf-artifacts/package-selection.json)" == "$CANDIDATE_COMMIT" ]] || { echo 'selected package does not match requested candidate source' >&2; exit 2; }
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > perf-artifacts/package-artifact.zip
      - name: Prepare disk space and optional measurement KVM
        env:
          EXPORT_ONLY: ${{ inputs.export_only }}
        run: |
          if [[ "$EXPORT_ONLY" != true ]]; then
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo mkdir -p /mnt/perf && sudo chown "$(id -u):$(id -g)" /mnt/perf
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf shellcheck zstd
          shellcheck scripts/tuna-frame-pacer-build
          python3 scripts/lib/tuna-perf-payload-tests.py
      - name: Build one shared preview payload
        id: shared_payload
        env:
          EXPORT_ONLY: ${{ inputs.export_only }}
          EXPORT_DISK: ${{ inputs.export_disk }}
        run: |
          # Evidence redirects intentionally belong to the unprivileged runner.
          # shellcheck disable=SC2024
          set -euo pipefail
          mkdir -p arch-artifacts
          python3 scripts/lib/tuna-perf-payload.py archive --zip perf-artifacts/package-artifact.zip --report perf-artifacts/package-selection.json --package arch-artifacts/selected.pkg.tar.zst --out perf-artifacts/package-payload.json
          cp arch-artifacts/selected.pkg.tar.zst tuna.pkg.tar.zst
          python3 scripts/lib/tuna-perf-payload.py copy --package tuna.pkg.tar.zst --report perf-artifacts/package-payload.json --out perf-artifacts/package-copy.json
          package_sha=$(jq -r '.package.sha256' perf-artifacts/package-payload.json)
          sha256sum tuna.pkg.tar.zst > perf-artifacts/package.sha256
          # One coherent distribution upgrade supplies BOTH explicit profiles.
          sudo podman build -f packaging/marlin/perf/Containerfile.baseline --target gnome-baseline -t localhost/marlin-gnome51-coherent:base . 2>&1 | tee perf-artifacts/coherent-build.log
          coherent_image=$(sudo podman inspect localhost/marlin-gnome51-coherent:base --format '{{.Id}}')
          printf '%s\n' "$coherent_image" > perf-artifacts/coherent-image-id
          profiles="diagnostic stock"
          if [[ "$EXPORT_ONLY" == true ]]; then profiles="$EXPORT_DISK"; fi
          for profile in $profiles; do
            profile_artifacts=perf-artifacts
            if [[ "$profile" == stock ]]; then profile_artifacts=perf-artifacts/stock; fi
            mkdir -p "$profile_artifacts"
            sudo podman build -f packaging/marlin/perf/Containerfile.baseline --build-arg "COHERENT_BASE=$coherent_image" --target "$profile-reference" -t localhost/marlin-gnome51-perf:base . 2>&1 | tee "$profile_artifacts/baseline-build.log"
            sudo podman build -f packaging/marlin/Containerfile --build-arg BASE_IMAGE=localhost/marlin-gnome51-perf:base --build-arg PERF_PINNED_BASELINE=true --build-arg TUNA_PKG=tuna.pkg.tar.zst --build-arg TUNA_PKG_SHA256="$package_sha" -t "localhost/marlin-tuna-preview:$profile" . 2>&1 | tee "$profile_artifacts/shared-preview-build.log"
            sudo podman inspect "localhost/marlin-tuna-preview:$profile" --format '{{.Id}}' | tee "shared-image-id-$profile"
            cp "shared-image-id-$profile" "$profile_artifacts/shared-image-id"
            python3 scripts/lib/tuna-perf-payload.py copy --package tuna.pkg.tar.zst --report perf-artifacts/package-payload.json --out "$profile_artifacts/package-copy-after-build.json"
            sudo podman run --rm "localhost/marlin-tuna-preview:$profile" pacman -Q tuna-desktop > "$profile_artifacts/installed-tuna-version"
            sudo podman run --rm "localhost/marlin-tuna-preview:$profile" pacman -Ql tuna-desktop > "$profile_artifacts/installed-tuna-files"
            # Copy actual installed critical bytes without executing the container.
            container=$(sudo podman create "localhost/marlin-tuna-preview:$profile" /usr/bin/true)
            trap 'sudo podman rm "$container"' EXIT
            while IFS= read -r member; do
            mkdir -p "$profile_artifacts/installed-payload/$(dirname "$member")"
            sudo podman cp "$container:/$member" "$profile_artifacts/installed-payload/$member"
            done < <(jq -r '.required_members | keys[]' perf-artifacts/package-payload.json)
            sudo chown -R "$(id -u):$(id -g)" "$profile_artifacts/installed-payload"
            python3 scripts/lib/tuna-perf-payload.py installed --installed "$profile_artifacts/installed-payload" --pacman-version "$profile_artifacts/installed-tuna-version" --pacman-files "$profile_artifacts/installed-tuna-files" --report perf-artifacts/package-payload.json --out "$profile_artifacts/installed-payload.json"
            mkdir -p "$profile_artifacts/runtime-versions"
            while IFS= read -r loader; do
            sudo podman run --rm "localhost/marlin-tuna-preview:$profile" sh -eu -c 'test -f "$1" && test -x "$1" && sha256sum "$1"' sh "$loader"
            done < <(jq -r '.required_members[] | select(.elf) | .elf.interpreter' perf-artifacts/package-payload.json | sort -u) | tee "$profile_artifacts/installed-interpreters.log"
            for bin in tuna-compositor tuna-session tuna-shell-host tuna-shell-gtk tuna-ibus-bridge tuna-greeter; do
            sudo podman run --rm "localhost/marlin-tuna-preview:$profile" sh -eu -c 'command -v "$1" && ldd "/usr/bin/$1"' sh "$bin" > "$profile_artifacts/runtime-versions/$bin.ldd" 2>&1
            if sudo podman run --rm "localhost/marlin-tuna-preview:$profile" "$bin" --version > "$profile_artifacts/runtime-versions/$bin.version" 2>&1; then
              printf '0\n' > "$profile_artifacts/runtime-versions/$bin.status"
            else
              status=$?
              printf '%s\n' "$status" > "$profile_artifacts/runtime-versions/$bin.status"
              cat "$profile_artifacts/runtime-versions/$bin.ldd" "$profile_artifacts/runtime-versions/$bin.version"
              exit "$status"
            fi
            done
            python3 scripts/lib/tuna-perf-payload.py runtime --runtime "$profile_artifacts/runtime-versions" --report perf-artifacts/package-payload.json --out "$profile_artifacts/installed-runtime.json"
            sudo podman rm "$container"
            trap - EXIT
            sudo podman inspect ghcr.io/tuna-os/marlin:gnome --format '{{.Digest}}' | tee base-digest
            sudo podman run --rm "localhost/marlin-tuna-preview:$profile" gnome-shell --version | tee "$profile_artifacts/gnome-version"
            grep -Eq '^GNOME Shell 51([. ]|$)' "$profile_artifacts/gnome-version"
            sudo podman run --rm "localhost/marlin-tuna-preview:$profile" pacman -Q | tee "$profile_artifacts/baseline-packages.txt"
            sudo podman run --rm "localhost/marlin-tuna-preview:$profile" cat /usr/share/tuna-perf-baseline-critical.sha256 > "$profile_artifacts/baseline-critical.sha256"
            if [[ "$profile" == diagnostic ]]; then
            for file in PKGBUILD release-trace-context.patch frame-source-evidence.patch drained-capture-start.patch sha256sums; do
            sudo podman run --rm "localhost/marlin-tuna-preview:$profile" cat "/usr/share/tuna-perf-mutter-profiler/$file" > "$profile_artifacts/mutter-profiler-$file"
            done
            fi
            sudo podman run --rm "localhost/marlin-tuna-preview:$profile" cat /usr/share/tuna-perf-reference.json > "$profile_artifacts/reference-image.json"
            chmod 0444 "$profile_artifacts/reference-image.json"
          done
      - name: Export bounded compact paired benchmark disk
        if: ${{ inputs.export_disk == 'stock' || inputs.export_disk == 'diagnostic' }}
        env:
          EXPORT_DISK: ${{ inputs.export_disk }}
          BENCHMARK_SSH_PUBLIC_KEY: ${{ inputs.benchmark_ssh_public_key }}
        run: |
          python3 - <<'PYKEY'
          import os
          from pathlib import Path
          os.umask(0o077)
          Path('/mnt/perf/benchmark-ssh-key.pub').write_text(os.environ['BENCHMARK_SSH_PUBLIC_KEY'].strip() + '\n')
          PYKEY
          scripts/tuna-benchmark-disk-export --format "${{ inputs.export_disk_format || 'qcow2' }}" --profile "$EXPORT_DISK" --ssh-public-key-file /mnt/perf/benchmark-ssh-key.pub
      - name: Upload compact benchmark disk and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && (inputs.export_disk == 'stock' || inputs.export_disk == 'diagnostic') }}
        with:
          name: marlin-benchmark-disk-${{ inputs.export_disk }}
          path: benchmark-disk/
          compression-level: 0
          retention-days: 7
      - name: Measure three alternating diagnostic pairs
        if: ${{ !inputs.export_only }}
        run: scripts/tuna-perf-profile-pairs diagnostic
      - name: Measure three alternating stock pairs
        # A rejected diagnostic capture stays a failed step. Stock still runs
        # from its separately guarded immutable image on this original host.
        if: ${{ !cancelled() && !inputs.export_only && steps.shared_payload.outcome == 'success' }}
        run: scripts/tuna-perf-profile-pairs stock
      - name: Upload performance artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: marlin-performance
          path: perf-artifacts
          retention-days: 14
