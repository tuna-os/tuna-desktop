# GDM 49+'s gnome-login greeter session with Tuna Desktop's login screen in
# place of GNOME Shell (#1164, docs/greeter.md). The package installs it
# inactive, as /usr/share/tuna-desktop/greeter/gnome-login.session.conf. An
# image switches its login screen by copying it to
# /etc/systemd/user/gnome-session@gnome-login.target.d/gnome-login.session.conf,
# where it replaces GDM's drop-in of the same name.
[Unit]
Requires=gnome-session-basic-services.target
Requires=tuna-greeter.service
