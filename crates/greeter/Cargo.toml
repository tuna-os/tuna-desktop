[package]
name = "tuna-greeter"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Tuna Desktop's login screen: a GTK4/libadwaita client of GDM's greeter D-Bus API, run by tuna-compositor --greeter"

[[bin]]
name = "tuna-greeter"
path = "src/main.rs"

[dependencies]
# v4_14: `Accessible::announce` for the prompt's messages, as the lock
# screen announces them.
gtk4 = { workspace = true, features = ["v4_14"] }
libadwaita.workspace = true
gtk4-layer-shell.workspace = true
glib.workspace = true
gio.workspace = true
tuna-auth-prompt = { path = "../auth-prompt", version = "0.1.0", features = ["gtk"] }
tuna-shell-control = { path = "../shell-control-schema", version = "0.1.0" }
# SSSD's CustomJSON auth-mechanisms requests and replies; serde for the
# mechanisms in SSSD's order.
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The web login dialog's QR code (webLogin.js `QrCode`), encoder only.
qrcode = { version = "0.15", default-features = false }

[dev-dependencies]
tempfile = "3"
