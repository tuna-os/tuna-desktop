[package]
name = "tuna-magnifier"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Screen magnifier settings shared by the GTK shell and the compositor (#349)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
rustix.workspace = true
# The magnifier's GSettings published as the snapshot (`gsettings`), for
# the shell and the login screen.
gio = { workspace = true, optional = true }

[features]
gio = ["dep:gio"]

[dev-dependencies]
tempfile = "3"
